name: Build DBX plugin candidates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: windows-2022
            target: windows-x64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: macos-15
            target: darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install DBX plugin CLI
        shell: bash
        run: npm install --global "@dbx-app/plugin-cli@0.1.6"

      # Same command and environment the release workflow uses, so a target that
      # builds here is guaranteed to build at release time.
      - name: Build unsigned candidate
        shell: bash
        env:
          DBX_PLUGIN_TARGET: ${{ matrix.target }}
        run: dbx-plugin package .

      - uses: actions/upload-artifact@v4
        with:
          name: dbx-plugin-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.dbxp
            dist/*.artifact.json
