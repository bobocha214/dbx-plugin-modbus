          tx: "发送", err: "错误",
          quality: "质量", timestamp: "时间戳",
          writeTitleRegister: "写入寄存器", writeTitleCoil: "写入线圈", writeTitleNode: "写入节点",
          writeHint: "双击数值即可写入；只读区域不可编辑。",
          start: "起始地址", scope: "范围", config: "配置",
          scopes: "配置", addScope: "新建配置", removeScope: "删除",
          wordBig: "高字在前", wordLittle: "低字在前",
          displayOnly: "仅影响解析出的数值，不改变读到的原始寄存器。",
          narrowType: "仅对占用四个寄存器的 64 位类型有效。",
          decoded: "解析值", addresses: "地址与值", items: "项",
          groupAddress: "地址", groupFormat: "解析方式", groupRead: "读取",
          nameLabel: "名称", on: "ON", off: "OFF",
          holding: "保持寄存器", input: "输入寄存器", coil: "线圈", discrete: "离散输入",
          readOnlyArea: "只读"
        }
      };
      let t = COPY.en;

      // ---------------------------------------------------------------------
      // Helpers
      // ---------------------------------------------------------------------
      function el(tag, props, children) {
        const node = document.createElement(tag);
        for (const [key, value] of Object.entries(props || {})) {
          if (value === null || value === undefined) continue;
          if (key === "class") node.className = value;
          else if (key === "text") node.textContent = value;
          else if (key === "style") node.setAttribute("style", value);
          else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
          else node.setAttribute(key, value);
        }
        for (const child of [].concat(children || [])) {
          if (child) node.appendChild(child);
        }
        return node;
      }

      function toast(message, kind) {
        const node = el("div", { class: "toast" + (kind ? " " + kind : ""), text: message });
        document.querySelector("#toast").appendChild(node);
        setTimeout(() => node.remove(), kind === "error" ? 9000 : 3500);
      }

      /** Modal confirm: alert/confirm/prompt are unavailable in the sandbox. */
      function confirmDialog(options) {
        return new Promise((resolve) => {
          const dialog = el("dialog");
          dialog.appendChild(el("h3", { text: options.title }));
          if (options.body) dialog.appendChild(el("p", { text: options.body }));
          if (options.payload) dialog.appendChild(el("div", { class: "payload", text: options.payload }));
          if (options.field) dialog.appendChild(el("div", { class: "row" }, [options.label && el("label", { text: options.label }), options.field]));
          else if (options.fieldNode) dialog.appendChild(el("div", { class: "row" }, [options.fieldNode]));
          dialog.appendChild(el("div", { class: "actions" }, [
            el("button", { text: t.cancel, onclick: () => { dialog.close(); resolve(null); } }),
            el("button", { class: "primary", text: options.confirmLabel || t.confirm,
              onclick: () => { dialog.close(); resolve(options.field ? options.field.value : true); } })
          ]));
          dialog.addEventListener("close", () => dialog.remove());
          document.body.appendChild(dialog);
          dialog.showModal();
          if (options.field) { options.field.focus(); options.field.select && options.field.select(); }
        });
      }

      function invoke(method, params, timeoutMs) {
        return host.invoke(method, params, { timeoutMs: timeoutMs || 30000 });
      }

      function errorText(error) {
        return String(error && error.message ? error.message : error);
      }

      function formatValue(value) {
        if (value === null || value === undefined) return "—";
        if (typeof value === "number") {
          if (Number.isInteger(value)) return String(value);
          return String(Number(value.toPrecision(8)));
        }
        if (typeof value === "object") {
          if (typeof value.byteLength === "number") return `[${value.byteLength} bytes]`;
          return JSON.stringify(value);
        }
        return String(value);
      }

      function parseScalar(text) {
        const trimmed = String(text).trim();
        if (trimmed === "true") return true;
        if (trimmed === "false") return false;
        if (trimmed !== "" && trimmed !== "-" && !Number.isNaN(Number(trimmed))) return Number(trimmed);
        return trimmed;
      }

      /** Renders a 16-bit register in the selected display format. */
      function formatRegister(value, format) {
        if (value === null || value === undefined) return "—";
        const word = ((Number(value) % 65536) + 65536) % 65536;
        switch (format) {
          case "signed": return String(word >= 32768 ? word - 65536 : word);
          case "hex": return "0x" + word.toString(16).toUpperCase().padStart(4, "0");
          case "binary": return word.toString(2).padStart(16, "0");
          default: return String(word);
        }
      }

      /** Five-digit, zero-padded address, as PLC documentation prints it. */
      function formatAddress(address) {
        return String(address).padStart(5, "0");
      }

      // How many 16-bit registers each data type occupies, and how to read the
      // assembled bytes back out. Mirrors the backend's decoder so a display
      // option can be applied without another round-trip to the device.
      const TYPE_LAYOUT = {
        uint16: ["u", 2], int16: ["i", 2],
        uint32: ["u", 4], int32: ["i", 4], float32: ["f", 4],
        uint64: ["u", 8], int64: ["i", 8], float64: ["f", 8]
      };

      /** How many registers a decoded value spans, or 1 for an unknown type. */
      function registerCount(dataType) {
        const layout = TYPE_LAYOUT[dataType];
        return layout ? layout[1] / 2 : 1;
      }

      /**
       * Reassembles registers into a value using the selected byte and word
       * order. Byte order names the position of each byte of a single 16-bit
       * register (ABCD/BADC) or swaps whole words (CDAB/DCBA); word order then
       * orders the words for values wider than 32 bits.
       */
      function decodeRegistersClient(registers, dataType, byteOrder, wordOrder) {
        const layout = TYPE_LAYOUT[dataType];
        if (!layout || !registers || !registers.length) return undefined;
        const [kind, byteWidth] = layout;
        const need = byteWidth / 2;
        if (registers.length < need) return undefined;

        const words = registers.slice(0, need).map((value) => ((Number(value) % 65536) + 65536) % 65536);
        // Order the words widest-first, honouring the word order for 64-bit
        // types and the CDAB/DCBA byte orders which are really word swaps.
        let ordered = words;
        if (byteOrder === "CDAB" && need >= 2) {
          ordered = words.slice().reverse();
        } else if (byteOrder === "DCBA" && need >= 2) {
          ordered = words.slice().reverse().map((word) => ((word & 0xff) << 8) | (word >> 8));
        }
        if (wordOrder === "little" && need >= 4) ordered = ordered.slice().reverse();

        // Flatten to a byte array, applying the per-register byte order.
        const bytes = [];
        for (const word of ordered) {
          let hi = (word >> 8) & 0xff;
          let lo = word & 0xff;
          if (byteOrder === "BADC" || byteOrder === "DCBA") {
            const swap = hi; hi = lo; lo = swap;
          }
          bytes.push(hi, lo);
        }

        const view = new DataView(new Uint8Array(bytes).buffer);
        if (kind === "f") {
          return byteWidth === 4 ? view.getFloat32(0, false) : view.getFloat64(0, false);
        }
        if (kind === "i") {
          if (byteWidth === 2) return view.getInt16(0, false);
          if (byteWidth === 4) return view.getInt32(0, false);
          return Number(view.getBigInt64(0, false));
        }
        if (byteWidth === 2) return view.getUint16(0, false);
        if (byteWidth === 4) return view.getUint32(0, false);
        return Number(view.getBigUint64(0, false));
      }

      function storageKeyFor(kind) {
        return `${kind}.${connectionId || "default"}`;
      }

      function hasStorage() {
        return !!(host.capabilities && host.capabilities.storage && host.storage);
      }

      // Persisted state keeps only the user's definitions. A live read result is
      // stale the moment it is written, and `storage` caps a single value at
      // 256 KiB, which a 2000-register dump would exceed.
      function persistable(items, definitionKeys) {
        return items.map((item) => {
          const kept = {};
          for (const key of definitionKeys) {
            if (item[key] !== undefined) kept[key] = item[key];
          }
          return kept;
        });
      }

      /** The same whitelist rule for a single object, not a list of them. */
      function persistableOne(source, definitionKeys) {
        return persistable([source], definitionKeys)[0];
      }

      function readStorage(key) {
        if (!hasStorage()) return Promise.resolve(null);
        return host.storage.get(key).catch(() => null);
      }

      function writeStorage(key, value) {
        if (!hasStorage()) return;
        host.storage.set(key, value).catch(() => {});
      }

      /** A labelled readout for the header counters. */
      function stat(label, initial) {
        const value = el("span", { class: "v", text: initial === undefined ? "—" : String(initial) });
        const node = el("div", { class: "stat" }, [
          el("span", { class: "k", text: label }),
          value
        ]);
        return { node, set: (text, kind) => { value.textContent = text; value.className = "v" + (kind ? " " + kind : ""); } };
      }

      /**
       * A draggable divider that reallocates width between two flex children.
       *
       * `before` keeps its share until dragging starts; from then on both panes
       * carry explicit flex-basis in pixels, so a pane can never be collapsed
       * to nothing (MIN_PANE) and the layout survives a resize.
       */
      function createSplitter(container, before, after) {
        const MIN_PANE = 180;
        const splitter = el("div", { class: "splitter", title: "Drag to resize" });
        let dragging = false;

        const onMove = (event) => {
          if (!dragging) return;
          const bounds = container.getBoundingClientRect();
          const x = (event.touches ? event.touches[0].clientX : event.clientX) - bounds.left;
          const width = Math.max(MIN_PANE, Math.min(bounds.width - MIN_PANE - splitter.offsetWidth, x));
          before.style.flex = `0 0 ${width}px`;
          after.style.flex = `1 1 auto`;
          event.preventDefault();
        };
        const stop = () => {
          if (!dragging) return;
          dragging = false;
          splitter.classList.remove("dragging");
          document.body.classList.remove("resizing");
          window.removeEventListener("mousemove", onMove);
          window.removeEventListener("mouseup", stop);
          window.removeEventListener("touchmove", onMove);
          window.removeEventListener("touchend", stop);
        };
        const start = (event) => {
          dragging = true;
          splitter.classList.add("dragging");
          document.body.classList.add("resizing");
          window.addEventListener("mousemove", onMove);
          window.addEventListener("mouseup", stop);
          window.addEventListener("touchmove", onMove, { passive: false });
          window.addEventListener("touchend", stop);
          event.preventDefault();
        };

        splitter.addEventListener("mousedown", start);
        splitter.addEventListener("touchstart", start, { passive: false });
        // Keyboard access: arrow keys nudge the divider like a real splitter.
        splitter.setAttribute("tabindex", "0");
        splitter.setAttribute("role", "separator");
        splitter.addEventListener("keydown", (event) => {
          const step = event.key === "ArrowLeft" ? -24 : event.key === "ArrowRight" ? 24 : 0;
          if (!step) return;
          const current = before.getBoundingClientRect().width;
          const bounds = container.getBoundingClientRect();
          const width = Math.max(MIN_PANE, Math.min(bounds.width - MIN_PANE, current + step));
          before.style.flex = `0 0 ${width}px`;
          after.style.flex = "1 1 auto";
          event.preventDefault();
        });
        return splitter;
      }

      // ---------------------------------------------------------------------
      // Modbus TCP workbench
      // ---------------------------------------------------------------------
      // The four addressable areas, in the order the protocol numbers them.
      const AREAS = ["holding", "input", "coil", "discrete"];
      const DATA_TYPES = ["uint16", "int16", "uint32", "int32", "float32", "uint64", "int64", "float64"];
      // "default" is deliberately absent: the connection no longer carries a
      // byte order, so every read names one explicitly.
      const BYTE_ORDERS = ["ABCD", "BADC", "CDAB", "DCBA"];
      const FORMATS = ["unsigned", "signed", "hex", "binary"];

      /** Function codes that address an area, for labels and the read path. */
      function functionCode(area, forWrite) {
        const table = {
          coil: forWrite ? "05/15" : "01",
          discrete: "02",
          holding: forWrite ? "06/16" : "03",
          input: "04"
        };
        return table[area] || "—";
      }

      function isBitArea(area) {
        return area === "coil" || area === "discrete";
      }

      function areaLabel(area) {
        return `${t[area] || area} · FC${functionCode(area, false)}`;
      }

      // One configuration per range. Each remembers what it last read, so
      // switching between them does not blank the table.
      const SCOPE_DEFAULTS = {
        area: "holding", start: 0, quantity: 16, unitId: 1,
        dataType: "uint16", byteOrder: "ABCD", wordOrder: "big",
        format: "unsigned", intervalMs: 1000, name: ""
      };
      // Exactly the definition keys: everything a read produced is excluded.
      const SCOPE_KEYS = ["id", ...Object.keys(SCOPE_DEFAULTS)];

      function newScope(patch) {
        return {
          id: Math.random().toString(36).slice(2, 10),
          result: null,
          ...SCOPE_DEFAULTS,
          ...(patch || {})
        };
      }

      /** "Holding 0 – 15" when the user has not named the range themselves. */
      function scopeTitle(scope) {
        if (scope.name && scope.name.trim()) return scope.name.trim();
        const end = scope.start + Math.max(1, scope.quantity) - 1;
        return `${t[scope.area] || scope.area} ${scope.start} – ${end}`;
      }

      function createModbusWorkbench(root) {
        const storageKey = storageKeyFor("modbus.scopes");
        const legacyKey = storageKeyFor("modbus.scope");
        const state = {
          scopes: [], activeId: null, busy: false, timer: null,
          tx: 0, err: 0
        };

        const active = () => state.scopes.find((scope) => scope.id === state.activeId) || state.scopes[0];

        // ---- header counters and actions ------------------------------------
        const sTx = stat(t.tx, 0);
        const sErr = stat(t.err, 0);
        const counters = el("div", { class: "stat-row" }, [sTx.node, sErr.node]);

        const readButton = el("button", { class: "primary", text: t.readOnce, onclick: () => readActive() });
        const pollButton = el("button", { text: t.poll, onclick: () => togglePolling() });
        document.querySelector("#appbar-extra").append(counters, readButton, pollButton);

        // ---- sidebar: the list you switch between ---------------------------
        const scopeList = el("div", { class: "scope-list" });
        const addButton = el("button", {
          class: "icon ghost", text: "+", title: t.addScope, onclick: () => addScope()
        });
        const sidebarHead = el("div", { class: "sidebar-head" }, [
          el("span", { class: "label", text: t.scopes }),
          el("span", { class: "spacer" }),
          addButton
        ]);

        const configForm = el("div", { class: "config" });
        const sidebar = el("aside", { class: "sidebar" }, [sidebarHead, scopeList, configForm]);

        // ---- content: only addresses and values -----------------------------
        const tableHead = el("thead");
        const tableBody = el("tbody");
        const table = el("table", {}, [tableHead, tableBody]);
        const tableWrap = el("div", { class: "table-wrap" }, [table]);
        const errorBar = el("div", { class: "error-bar", style: "display:none" });

        const rangeLabel = el("span", { class: "count" });
        const decodedLabel = el("span", { class: "k", text: t.decoded });
        const decodedValue = el("span", { class: "v" });
        const decodedMeta = el("span", { class: "m" });
        const decodedBox = el("div", { class: "decoded" }, [decodedLabel, decodedValue, decodedMeta]);

        const contentHead = el("div", { class: "content-head" }, [
          el("div", { class: "content-title" }, [
            el("h2", { text: t.addresses }),
            rangeLabel
          ]),
          el("span", { class: "spacer" }),
          decodedBox
        ]);

        // The footnote says what to do next: read the range, or how to write it.
        const footnote = el("div", { class: "hint", text: t.writeHint });

        const content = el("section", { class: "content" }, [
          contentHead, errorBar, tableWrap, footnote
        ]);

        root.appendChild(sidebar);
        root.appendChild(createSplitter(root, sidebar, content));
        root.appendChild(content);

        // Row nodes are kept when only values change, so a 2000-bit range does
        // not rebuild its whole table on every poll tick.
        let rowCache = { key: "", rows: [] };

        // ---- persistence ----------------------------------------------------
        function persist() {
          writeStorage(storageKey, {
            activeId: state.activeId,
            scopes: persistable(state.scopes, SCOPE_KEYS)
          });
        }

        function addScope() {
          const current = active();
          const patch = current
            ? {
                area: current.area,
                // A new range starts where the last one ended, which is the
                // common case when walking through a device block by block.
                start: Math.min(65535, current.start + Math.max(1, current.quantity)),
                quantity: current.quantity,
                unitId: current.unitId,
                dataType: current.dataType,
                byteOrder: current.byteOrder,
                wordOrder: current.wordOrder,
                format: current.format,
                intervalMs: current.intervalMs
              }
            : {};
          const scope = newScope(patch);
          state.scopes.push(scope);
          state.activeId = scope.id;
          persist();
          renderScopeList();
          renderConfig();
          renderTable(true);
          readActive();
        }

        function removeScope(scope) {
          if (state.scopes.length <= 1) {
            // Keep one configuration at all times: an empty workbench has no
            // meaningful state and no way back without a plus button hunt.
            toast(t.emptyGrid, "info");
            return;
          }
          if (state.timer) stopPolling();
          state.scopes = state.scopes.filter((entry) => entry !== scope);
          if (state.activeId === scope.id) state.activeId = state.scopes[0].id;
          persist();
          renderScopeList();
          renderConfig();
          renderTable(true);
          // Land on a range that actually has something to show.
          const next = active();
          if (next && !next.result) readActive();
        }

        function selectScope(scope) {
          if (state.activeId === scope.id) return;
          state.activeId = scope.id;
          persist();
          renderScopeList();
          renderConfig();
          renderTable(true);
          // Polling follows the selection, otherwise the timer would keep
          // reading a range that is no longer on screen.
          if (state.timer) {
            restartPolling();
          } else if (!scope.result) {
            // Switching to a range is a request to see it, so load it rather
            // than showing an empty table and making the user press Read.
            readActive();
          }
        }

        // ---- scope list -----------------------------------------------------
        function renderScopeList() {
          scopeList.textContent = "";
          for (const scope of state.scopes) {
            const selected = scope.id === state.activeId;
            const item = el("div", {
              class: "scope-item" + (selected ? " active" : ""),
              tabindex: "0", role: "button",
              "aria-current": selected ? "true" : null,
              onclick: () => selectScope(scope),
              onkeydown: (event) => {
                if (event.key === "Enter" || event.key === " ") { event.preventDefault(); selectScope(scope); }
              }
            });

            const dotState = scope.result
              ? (scope.result.error ? "bad" : "ok")
              : "";
            item.appendChild(el("span", { class: "scope-dot " + dotState }));
            item.appendChild(el("div", { class: "scope-body" }, [
              el("span", { class: "scope-name", text: scopeTitle(scope), title: scopeTitle(scope) }),
              el("span", {
                class: "scope-meta",
                text: `${formatAddress(scope.start)}–${formatAddress(scope.start + Math.max(1, scope.quantity) - 1)}`
              })
            ]));
            item.appendChild(el("button", {
              class: "icon ghost danger scope-del", text: "✕", title: t.removeScope,
              onclick: (event) => { event.stopPropagation(); removeScope(scope); }
            }));
            scopeList.appendChild(item);
          }
        }

        // ---- config form ----------------------------------------------------
        /** A labelled control row, appending to whichever section is given. */
        function formRow(parent, label, control, title) {
          parent.appendChild(el("div", { class: "form-row" }, [
            el("label", { text: label, title: title || null }),
            control
          ]));
        }

        function renderConfig() {
          const scope = active();
          if (!scope) return;
          configForm.textContent = "";

          // Identity
          const nameInput = el("input", {
            type: "text", value: scope.name || "", placeholder: scopeTitle(scope),
            onchange: (event) => {
              scope.name = event.target.value.trim();
              persist();
              renderScopeList();
            }
          });
          const identity = el("div", { class: "config-section" });
          formRow(identity, t.nameLabel, nameInput);
          configForm.appendChild(identity);

          // ---- address ------------------------------------------------------
          const addressSection = el("div", { class: "config-section" }, [
            el("div", { class: "title", text: t.groupAddress })
          ]);

          const areaSelect = el("select", {
            onchange: (event) => {
              scope.area = event.target.value;
              const cap = isBitArea(scope.area) ? 2000 : 125;
              if (scope.quantity > cap) scope.quantity = cap;
              changedDefinition();
            }
          }, AREAS.map((value) => el("option", {
            value, text: areaLabel(value), selected: value === scope.area ? "selected" : null
          })));
          formRow(addressSection, t.area, areaSelect);

          const startInput = el("input", {
            type: "number", min: "0", max: "65535", value: String(scope.start),
            onchange: (event) => {
              scope.start = Math.max(0, Math.min(65535, Number(event.target.value) || 0));
              event.target.value = String(scope.start);
              changedDefinition();
            }
          });
          const quantityInput = el("input", {
            type: "number", min: "1", max: String(isBitArea(scope.area) ? 2000 : 125),
            value: String(scope.quantity),
            onchange: (event) => {
              const cap = isBitArea(scope.area) ? 2000 : 125;
              scope.quantity = Math.max(1, Math.min(cap, Number(event.target.value) || 1));
              event.target.value = String(scope.quantity);
              changedDefinition();
            }
          });
          addressSection.appendChild(el("div", { class: "form-pair" }, [
            el("div", { class: "form-row" }, [el("label", { text: t.start }), startInput]),
            el("div", { class: "form-row" }, [el("label", { text: t.quantity }), quantityInput])
          ]));

          const unitInput = el("input", {
            type: "number", min: "0", max: "255", value: String(scope.unitId),
            onchange: (event) => {
              scope.unitId = Math.max(0, Math.min(255, Number(event.target.value) || 0));
              event.target.value = String(scope.unitId);
              persist();
              updateCounters();
            }
          });
          formRow(addressSection, t.unit, unitInput);
          configForm.appendChild(addressSection);

          // ---- interpretation ----------------------------------------------
          const formatSection = el("div", { class: "config-section" }, [
            el("div", { class: "title", text: t.groupFormat })
          ]);

          const dataTypeSelect = el("select", {
            onchange: (event) => {
              scope.dataType = event.target.value;
              // Word order only reorders words for values spanning four
              // registers, so it is disabled for everything narrower.
              syncWordOrder();
              changedDisplay();
            }
          }, DATA_TYPES.map((value) => el("option", {
            value, text: value, selected: value === scope.dataType ? "selected" : null
          })));
          formRow(formatSection, t.dataType, dataTypeSelect);

          const byteOrderSelect = el("select", {
            title: t.displayOnly,
            onchange: (event) => { scope.byteOrder = event.target.value; changedDisplay(); }
          }, BYTE_ORDERS.map((value) => el("option", {
            value, text: value, selected: value === scope.byteOrder ? "selected" : null
          })));
          const wordOrderSelect = el("select", {
            onchange: (event) => { scope.wordOrder = event.target.value; changedDisplay(); }
          }, [["big", t.wordBig], ["little", t.wordLittle]].map(([value, label]) => el("option", {
            value, text: label, selected: value === scope.wordOrder ? "selected" : null
          })));
          formatSection.appendChild(el("div", { class: "form-pair" }, [
            el("div", { class: "form-row" }, [el("label", { text: t.byteOrder }), byteOrderSelect]),
            el("div", { class: "form-row" }, [el("label", { text: t.wordOrder }), wordOrderSelect])
          ]));

          const formatSelect = el("select", {
            onchange: (event) => { scope.format = event.target.value; changedDisplay(); }
          }, FORMATS.map((value) => el("option", {
            value, text: value, selected: value === scope.format ? "selected" : null
          })));
          formRow(formatSection, t.format, formatSelect);
          configForm.appendChild(formatSection);

          function syncWordOrder() {
            const relevant = registerCount(scope.dataType) >= 4;
            wordOrderSelect.disabled = !relevant;
            wordOrderSelect.style.opacity = relevant ? "" : ".5";
            wordOrderSelect.title = relevant ? t.displayOnly : t.narrowType;
          }
          syncWordOrder();

          // ---- reading ------------------------------------------------------
          const readSection = el("div", { class: "config-section" }, [
            el("div", { class: "title", text: t.groupRead })
          ]);
          const intervalInput = el("input", {
            type: "number", min: "50", step: "50", value: String(scope.intervalMs),
            onchange: (event) => {
              scope.intervalMs = Math.max(50, Number(event.target.value) || 1000);
              event.target.value = String(scope.intervalMs);
              persist();
              if (state.timer) restartPolling();
            }
          });
          formRow(readSection, `${t.interval} (${t.ms})`, intervalInput);
          configForm.appendChild(readSection);

          // The decoded value of the range is not repeated here: it is shown in
          // the table header, which is always on screen and does not require
          // scrolling the form to see.
        }

        /**
         * Changing which addresses are read invalidates what is on screen.
         * Changing only how they are interpreted does not: the registers that
         * came back are still correct, so the table is re-rendered rather than
         * emptied, and byte order takes effect without another request.
         */
        function changedDefinition() {
          const scope = active();
          if (scope) scope.result = null;
          persist();
          renderScopeList();
          renderTable(true);
        }

        function changedDisplay() {
          persist();
          renderTable();
        }

        // ---- reading --------------------------------------------------------
        function scopeTask(scope) {
          const task = {
            area: scope.area,
            address: scope.start,
            quantity: scope.quantity,
            unitId: scope.unitId,
            dataType: scope.dataType
          };
          // Sent with the request so the backend decodes with exactly the
          // settings on screen when the bytes were fetched.
          if (!isBitArea(scope.area)) {
            task.byteOrder = scope.byteOrder;
            task.wordOrder = scope.wordOrder;
          }
          return task;
        }

        async function readActive() {
          const scope = active();
          if (!scope || state.busy) return;
          state.busy = true;
          try {
            const response = await invoke("modbus/read", {
              connectionId, tasks: [scopeTask(scope)]
            }, 20000);
            const result = (response.results || [])[0] || { ok: false, error: "no result" };
            state.tx += 1;
            if (result.ok === false) {
              state.err += 1;
              scope.result = { registers: [], values: [], error: result.error || "error", at: new Date() };
              toast(result.error || "Read failed", "error");
            } else {
              scope.result = {
                registers: result.registers || [],
                values: result.values || [],
                error: null,
                at: new Date()
              };
            }
            updateCounters();
            renderScopeList();
            renderTable();
          } catch (error) {
            state.tx += 1;
            state.err += 1;
            scope.result = { registers: [], values: [], error: errorText(error), at: new Date() };
            updateCounters();
            renderScopeList();
            renderTable();
            toast(errorText(error), "error");
          } finally {
            state.busy = false;
          }
        }

        function updateCounters() {
          sTx.set(String(state.tx));
          sErr.set(String(state.err), state.err ? "bad" : null);
        }

        // ---- the address/value table ----------------------------------------
        function renderTable(force) {
          const scope = active();
          if (!scope) return;
          const bit = isBitArea(scope.area);
          const count = Math.max(1, scope.quantity);
          const key = `${scope.area}:${scope.start}:${count}:${bit ? "b" : "r"}`;

          rangeLabel.textContent = `${formatAddress(scope.start)} – ${formatAddress(scope.start + count - 1)} · ${count} ${t.items}`;

          // Errors are a property of the request, not of any single address, so
          // they get one bar rather than being repeated down every row.
          const error = scope.result && scope.result.error;
          errorBar.style.display = error ? "" : "none";
          errorBar.textContent = error || "";
          // Until the range has been read the footnote explains why the values
          // are blank, instead of repeating the write instructions.
          footnote.textContent = scope.result ? t.writeHint : t.emptyTable;

          renderDecoded(scope);

          if (!force && rowCache.key === key && rowCache.rows.length === count) {
            updateRows(scope);
            return;
          }

          tableHead.textContent = "";
          const headRow = el("tr");
          headRow.appendChild(el("th", { class: "addr", text: t.address }));
          headRow.appendChild(el("th", { class: "val", text: bit ? t.state : t.value }));
          headRow.appendChild(el("th", { class: "raw", text: bit ? "1 / 0" : t.raw }));
          headRow.appendChild(el("th", { class: "filler" }));
          tableHead.appendChild(headRow);

          tableBody.textContent = "";
          rowCache = { key, rows: [] };

          // Rows are drawn for the whole configured range whether or not it has
          // been read, so changing the origin shows the new addresses at once
          // and an unread range is still legible as "these are the addresses".
          for (let offset = 0; offset < count; offset += 1) {
            const address = scope.start + offset;
            const tr = el("tr");
            tr.appendChild(el("td", { class: "addr", text: formatAddress(address) }));

            if (bit) {
              const valueCell = el("td", { class: "val" });
              const span = el("span", { class: "bit" });
              span.appendChild(el("i"));
              span.appendChild(el("span", { class: "txt" }));
              const holder = el("span", { class: "cell-value" });
              holder.appendChild(span);
              valueCell.appendChild(holder);
              tr.appendChild(valueCell);
              const rawCell = el("td", { class: "raw" });
              tr.appendChild(rawCell);
              tr.appendChild(el("td", { class: "filler" }));

              const writable = scope.area === "coil";
              if (writable) {
                holder.title = `${formatAddress(address)} · ${t.writeHint}`;
                holder.addEventListener("dblclick", () => writeCell(scope, address, null));
              } else {
                holder.classList.add("readonly");
                holder.title = `${formatAddress(address)} · ${t.readOnlyArea}`;
              }
              rowCache.rows.push({ valueCell, holder, span, rawCell, address });
            } else {
              const valueCell = el("td", { class: "val" });
              const holder = el("span", { class: "cell-value" });
              valueCell.appendChild(holder);
              tr.appendChild(valueCell);
              const rawCell = el("td", { class: "raw" });
              tr.appendChild(rawCell);
              tr.appendChild(el("td", { class: "filler" }));

              const writable = scope.area === "holding";
              if (writable) {
                holder.title = `${formatAddress(address)} · ${scope.dataType} · ${t.writeHint}`;
                holder.addEventListener("dblclick", () => writeCell(scope, address, null));
              } else {
                holder.classList.add("readonly");
                holder.title = `${formatAddress(address)} · ${t.readOnlyArea}`;
              }
              rowCache.rows.push({ valueCell, holder, rawCell, address });
            }
            tableBody.appendChild(tr);
          }
          updateRows(scope);
        }

        /** Writes current values into the existing row nodes. */
        function updateRows(scope) {
          const bit = isBitArea(scope.area);
          const result = scope.result;
          for (let offset = 0; offset < rowCache.rows.length; offset += 1) {
            const row = rowCache.rows[offset];
            if (bit) {
              const value = result && result.values ? result.values[offset] : undefined;
              row.span.className = "bit" + (value === undefined ? " unknown" : (value ? " on" : ""));
              row.span.lastChild.textContent = value === undefined ? "—" : (value ? t.on : t.off);
              row.rawCell.textContent = value === undefined ? "" : (value ? "1" : "0");
              row.holder.classList.toggle("muted", value === undefined);
            } else {
              const value = result && result.registers ? result.registers[offset] : undefined;
              row.holder.textContent = formatRegister(value, scope.format);
              row.holder.classList.toggle("muted", value === undefined);
              row.rawCell.textContent = value === undefined
                ? "" : "0x" + (((Number(value) % 65536) + 65536) % 65536).toString(16).toUpperCase().padStart(4, "0");
            }
          }
        }

        function renderDecoded(scope) {
          const bit = isBitArea(scope.area);
          const hasData = scope.result && !scope.result.error && !bit;
          if (!hasData) {
            decodedBox.style.display = "none";
            return;
          }
          decodedBox.style.display = "";
          const value = decodeRegistersClient(scope.result.registers, scope.dataType, scope.byteOrder, scope.wordOrder);
          decodedValue.textContent = formatValue(value);
          decodedMeta.textContent = [
            scope.dataType, scope.byteOrder, scope.wordOrder,
            `${registerCount(scope.dataType)} × 16-bit`
          ].join(" · ");
        }

        // ---- writing --------------------------------------------------------
        async function writeCell(scope, address, current) {
          const bit = isBitArea(scope.area);
          const index = address - scope.start;
          const existing = scope.result
            ? (bit ? (scope.result.values || [])[index] : (scope.result.registers || [])[index])
            : undefined;

          const field = el("input", {
            type: "text",
            value: bit
              ? (existing ? "true" : "false")
              : formatRegister(existing, "unsigned"),
            placeholder: bit ? "true / false" : scope.dataType
          });
          const payload = [
            `${t[scope.area] || scope.area} @ ${formatAddress(address)}`,
            `unit ${scope.unitId}`,
            bit ? "" : scope.dataType
          ].filter(Boolean).join(" · ");

          const confirmed = await confirmDialog({
            title: bit ? t.writeTitleCoil : t.writeTitleRegister,
            body: t.confirmWriteBody,
            payload, field, label: t.value,
            confirmLabel: t.confirm
          });
          if (confirmed === null) return;

          try {
            const entry = { area: scope.area, address, unitId: scope.unitId };
            if (bit) {
              const text = String(field.value).trim().toLowerCase();
              entry.value = !(text === "false" || text === "0");
            } else {
              entry.dataType = scope.dataType;
              entry.byteOrder = scope.byteOrder;
              entry.wordOrder = scope.wordOrder;
              entry.value = Number(field.value);
              if (!Number.isFinite(entry.value)) {
                toast(`"${field.value}" is not a number`, "error");
                return;
              }
            }
            const response = await invoke("modbus/write", { connectionId, writes: [entry] }, 20000);
            const result = (response.results || [])[0];
            state.tx += 1;
            if (result && result.ok) {
              toast(`${formatAddress(address)} ← ${field.value}`, "info");
              readActive();
            } else {
              state.err += 1;
              updateCounters();
              toast((result && result.error) || "Write failed", "error");
            }
          } catch (error) {
            toast(errorText(error), "error");
          }
        }

        // ---- polling --------------------------------------------------------
        function togglePolling() {
          if (state.timer) { stopPolling(); return; }
          startPolling();
        }

        function startPolling() {
          const scope = active();
          if (!scope) return;
          state.timer = setInterval(readActive, scope.intervalMs);
          pollButton.textContent = t.stop;
          pollButton.setAttribute("aria-pressed", "true");
          readActive();
        }

        function stopPolling() {
          clearInterval(state.timer);
          state.timer = null;
          pollButton.textContent = t.poll;
          pollButton.setAttribute("aria-pressed", "false");
        }

        function restartPolling() {
          stopPolling();
          startPolling();
        }

        // ---- boot -----------------------------------------------------------
        (async () => {
          const saved = await readStorage(storageKey);
          let scopes = [];

          if (saved && Array.isArray(saved.scopes) && saved.scopes.length) {
            scopes = saved.scopes.map((entry) => newScope(entry));
          } else {
            // Bring across the single-scope definition written by earlier
            // versions, so an existing workbench does not come up blank.
            const legacy = await readStorage(legacyKey);
            if (legacy && typeof legacy === "object" && !Array.isArray(legacy)) {
              scopes = [newScope(legacy)];
            }
          }
          if (!scopes.length) scopes = [newScope()];

          state.scopes = scopes;
          state.activeId = (saved && saved.activeId && scopes.some((scope) => scope.id === saved.activeId))
            ? saved.activeId
            : scopes[0].id;

          // Older scopes were saved without an id; give them a stable one.
          for (const scope of state.scopes) if (!scope.id) scope.id = newScope().id;
          if (!state.scopes.some((scope) => scope.id === state.activeId)) state.activeId = state.scopes[0].id;

          updateCounters();
          renderScopeList();
          renderConfig();
          renderTable(true);
          readActive();
        })();

        window.addEventListener("beforeunload", () => { if (state.timer) clearInterval(state.timer); });
      }

      // ---------------------------------------------------------------------
      // OPC UA workbench
      // ---------------------------------------------------------------------
      const NAMESPACE_ROOT = "i=84"; // Root folder: Objects / Types / Views

      /** Single letter per node class, colour-coded, standing in for an icon. */
      function classGlyph(nodeClass) {
        const name = String(nodeClass || "");
        if (name.startsWith("Object")) return ["O", "object"];
        if (name.startsWith("Variable")) return ["V", "variable"];
        if (name.startsWith("Method")) return ["M", "method"];
        if (name.startsWith("View")) return ["W", "view"];
        if (name.includes("Type")) return ["T", "type"];
        return ["·", ""];
      }

      function createOpcuaWorkbench(root) {
        const storageKey = storageKeyFor("opcua.nodes");
        const state = {
          nodes: [], subscriptionId: null, intervalMs: 1000, busy: false,
          selected: null, selectedAttributes: null, namespaces: [], highlight: ""
        };
        const childrenCache = new Map();
        const treeRows = new Map();

        // ---- header actions -------------------------------------------------
        const readAllButton = el("button", { text: t.readAll, onclick: () => readAll() });
        const subscribeButton = el("button", { class: "primary", text: t.subscribe, onclick: () => subscribe() });
        const unsubscribeButton = el("button", { text: t.unsubscribe, onclick: () => unsubscribe() });
        document.querySelector("#appbar-extra").append(readAllButton, subscribeButton, unsubscribeButton);

        // ---- sidebar: address space -----------------------------------------
        const tree = el("div", { class: "tree" });
        const namespaceSelect = el("select", {
          style: "width:100%",
          onchange: (event) => { state.highlight = event.target.value; applyHighlight(); }
        });
        const rebrowseButton = el("button", {
          class: "icon ghost", text: "⟳", title: t.refresh,
          onclick: () => { childrenCache.clear(); loadRoot(); }
        });

        const sidebar = el("aside", { class: "sidebar" }, [
          el("div", { class: "sidebar-head" }, [
            el("span", { class: "label", text: t.browse }),
            el("span", { class: "spacer" }),
            rebrowseButton
          ]),
          el("div", { class: "config", style: "flex:none;padding:8px 10px 6px" }, [
            el("div", { class: "form-row" }, [
              el("label", { text: t.namespace }),
              namespaceSelect
            ])
          ]),
          el("div", { style: "flex:1;min-height:0;overflow:auto;border-top:var(--dbx-line)" }, [tree]),
          el("div", { class: "hint", text: t.browseHint })
        ]);

        // ---- content: watched nodes and values ------------------------------
        const watchHead = el("thead");
        const watchBody = el("tbody");
        const watchTable = el("table", {}, [watchHead, watchBody]);
        const watchWrap = el("div", { class: "table-wrap" }, [watchTable]);

        const nodeInput = el("input", {
          type: "text", placeholder: "ns=3;s=Temperature", style: "width:230px",
          title: t.addNodeHint,
          onkeydown: (event) => {
            if (event.key !== "Enter") return;
            const value = nodeInput.value.trim();
            if (!value) return;
            addNode(value, value);
            nodeInput.value = "";
          }
        });

        // The read/subscribe actions live in the header; the content head only
        // holds the node id field, so nothing is offered twice.
        const watchCount = el("span", { class: "count" });
        const contentHead = el("div", { class: "content-head" }, [
          el("div", { class: "content-title" }, [
            el("h2", { text: t.watch }),
            watchCount
          ]),
          el("span", { class: "spacer" }),
          nodeInput
        ]);

        const attrs = el("div", { class: "attrs" });
        const attrsPanel = el("div", { class: "attrs-panel" }, [
          el("div", { class: "attrs-head" }, [
            el("span", { text: t.attributes }),
            el("span", { class: "spacer" }),
            el("span", { id: "attr-node", style: "font-family:var(--dbx-mono);text-transform:none;letter-spacing:0" })
          ]),
          attrs
        ]);

        const content = el("section", { class: "content" }, [
          contentHead, watchWrap, attrsPanel
        ]);

        root.appendChild(sidebar);
        root.appendChild(createSplitter(root, sidebar, content));
        root.appendChild(content);

        function persist() {
          writeStorage(storageKey, persistable(state.nodes, ["nodeId", "label"]));
        }

        // ---- watch list ------------------------------------------------------
        function renderWatch() {
          watchHead.textContent = "";
          watchHead.appendChild(el("tr", {}, [
            el("th", { text: t.nodeId }),
            el("th", { text: t.value }),
            el("th", { text: t.dataType }),
            el("th", { text: t.timestamp }),
            el("th", { text: t.quality }),
            el("th", { text: "" })
          ]));

          watchBody.textContent = "";
          watchCount.textContent = state.nodes.length ? `${state.nodes.length} ${t.items}` : "";

          if (!state.nodes.length) {
            watchBody.appendChild(el("tr", {}, [
              el("td", { colspan: "6" }, [el("div", { class: "empty", text: t.emptyNodes })])
            ]));
            return;
          }

          for (const node of state.nodes) {
            const bad = node.status !== undefined && node.status !== "" && !node.good;
            const tr = el("tr");
            tr.appendChild(el("td", { class: "kv", text: node.nodeId, title: node.nodeId }));
            const valueCell = el("td", { class: "val" });
            valueCell.appendChild(el("span", {
              class: "cell-value", title: t.writeHint,
              onclick: () => writeNode(node),
              text: formatValue(node.value)
            }));
            tr.appendChild(valueCell);
            tr.appendChild(el("td", { class: "note", text: node.dataType || "" }));
            tr.appendChild(el("td", {
              class: "note", text: node.sourceTimestamp ? shortTime(node.sourceTimestamp) : ""
            }));
            tr.appendChild(el("td", {
              class: node.good ? "good" : (bad ? "bad" : "note"),
              text: node.status || (node.good ? "Good" : "")
            }));
            tr.appendChild(el("td", {}, [
              el("button", {
                class: "icon ghost danger", text: "✕", title: t.removeScope,
                onclick: () => {
                  state.nodes = state.nodes.filter((entry) => entry !== node);
                  persist();
                  renderWatch();
                  collectNamespaces();
                }
              })
            ]));
            watchBody.appendChild(tr);
          }
        }

        function shortTime(value) {
          const text = String(value);
          const match = text.match(/T(\d{2}:\d{2}:\d{2})/);
          return match ? match[1] : text;
        }

        function addNode(nodeId, label) {
          if (!nodeId || state.nodes.some((node) => node.nodeId === nodeId)) return;
          state.nodes.push({ nodeId, label: label || "", value: null, dataType: "", status: "", good: false });
          persist();
          renderWatch();
          collectNamespaces();
          readAll();
        }

        // ---- address space ---------------------------------------------------
        async function browseChildren(nodeId) {
          const response = await invoke("opcua/browse", { connectionId, nodeId, direction: "forward", maxReferences: 1000 }, 30000);
          return response.references || [];
        }

        function renderTreeRow(container, reference, depth) {
          const nodeId = reference.nodeId;
          const label = reference.displayName || reference.browseName;
          const row = el("div", {
            class: "tree-row", style: `padding-left:${depth * 13 + 4}px`, title: nodeId
          });
          const twisty = el("span", { class: "twisty", text: "▸" });
          const [glyph, glyphClass] = classGlyph(reference.nodeClass);
          row.appendChild(twisty);
          row.appendChild(el("span", { class: "nclass " + glyphClass, text: glyph }));
          row.appendChild(el("span", { class: "name", text: label }));
          container.appendChild(row);

          const childrenBox = el("div", { style: "display:none" });
          container.appendChild(childrenBox);
          treeRows.set(nodeId, row);

          let loaded = false;
          let open = false;
          const toggle = async () => {
            if (open) {
              open = false;
              childrenBox.style.display = "none";
              twisty.textContent = "▸";
              return;
            }
            if (!loaded) {
              twisty.textContent = "…";
              try {
                const references = childrenCache.has(nodeId) ? childrenCache.get(nodeId) : await browseChildren(nodeId);
                childrenCache.set(nodeId, references);
                childrenBox.textContent = "";
                if (!references.length) {
                  childrenBox.appendChild(el("div", {
                    class: "hint", style: `padding-left:${(depth + 1) * 13 + 22}px`,
                    text: t.noChildren
                  }));
                }
                for (const reference2 of references) renderTreeRow(childrenBox, reference2, depth + 1);
                loaded = true;
                // Newly revealed children can introduce namespaces the picker
                // has not seen yet.
                collectNamespaces();
                applyHighlight();
              } catch (error) {
                twisty.textContent = "▸";
                toast(errorText(error), "error");
                return;
              }
            }
            open = true;
            childrenBox.style.display = "";
            twisty.textContent = "▾";
          };

          row.addEventListener("click", () => { selectNode(nodeId); toggle(); });
          row.addEventListener("dblclick", (event) => { event.stopPropagation(); addNode(nodeId, label); });
        }

        // One namespace is highlighted at a time rather than filtering the rest
        // out, which keeps the tree shape stable while drawing the eye.
        function applyHighlight() {
          for (const [nodeId, row] of treeRows) {
            if (!state.highlight) { row.classList.remove("dim", "highlight"); continue; }
            const namespace = namespaceOf(nodeId);
            row.classList.toggle("highlight", namespace === state.highlight);
            row.classList.toggle("dim", namespace !== state.highlight);
          }
        }

        function namespaceOf(nodeId) {
          const match = String(nodeId).match(/ns=(\d+)/);
          return match ? match[1] : "0";
        }

        function collectNamespaces() {
          const found = new Set();
          for (const nodeId of treeRows.keys()) found.add(namespaceOf(nodeId));
          for (const node of state.nodes) found.add(namespaceOf(node.nodeId));
          state.namespaces = [...found].sort((a, b) => Number(a) - Number(b));
          namespaceSelect.textContent = "";
          namespaceSelect.appendChild(el("option", { value: "", text: t.allNamespaces }));
          for (const index of state.namespaces) {
            namespaceSelect.appendChild(el("option", {
              value: index, text: `ns=${index}`,
              selected: state.highlight === index ? "selected" : null
            }));
          }
        }

        async function loadRoot() {
          tree.textContent = "";
          treeRows.clear();
          tree.appendChild(el("div", { class: "hint", text: t.loading }));
          try {
            const roots = await browseChildren(NAMESPACE_ROOT);
            tree.textContent = "";
            for (const reference of roots) renderTreeRow(tree, reference, 0);
            if (!roots.length) tree.appendChild(el("div", { class: "hint", text: t.noChildren }));
            collectNamespaces();
            applyHighlight();
          } catch (error) {
            tree.textContent = "";
            tree.appendChild(el("div", { class: "hint", text: errorText(error) }));
          }
        }

        // ---- attributes ------------------------------------------------------
        function renderAttributes() {
          attrs.textContent = "";
          const heading = document.getElementById("attr-node");
          if (heading) heading.textContent = state.selected || "";
          if (!state.selected) {
            attrs.appendChild(el("div", { class: "empty", text: t.attrHint }));
            return;
          }
          const rows = [
            [t.nodeId, state.selected],
            ...(state.selectedAttributes || [])
          ];
          for (const [key, value] of rows) {
            attrs.appendChild(el("div", { class: "attr" }, [
              el("span", { class: "k", text: key }),
              el("span", { class: "v", text: value })
            ]));
          }
        }

        // Reading a node reuses the normal read path so the pane shows exactly
        // what the device reports, not a cached copy.
        async function selectNode(nodeId) {
          state.selected = nodeId;
          state.selectedAttributes = null;
          for (const [id, row] of treeRows) row.classList.toggle("selected", id === nodeId);
          renderAttributes();
          try {
            const response = await invoke("opcua/read", { connectionId, nodeIds: [nodeId] }, 30000);
            const first = (response.results || [])[0] || {};
            state.selectedAttributes = [
              [t.value, formatValue(first.value)],
              [t.dataType, first.dataType || ""],
              [t.quality, first.status || ""],
              ["Source ts", first.sourceTimestamp || ""],
              ["Server ts", first.serverTimestamp || ""]
            ];
          } catch (error) {
            state.selectedAttributes = [["Error", errorText(error)]];
          }
          renderAttributes();
        }

        // ---- reading ---------------------------------------------------------
        async function readAll() {
          if (state.busy || !state.nodes.length) return;
          state.busy = true;
          try {
            const response = await invoke("opcua/read", {
              connectionId, nodeIds: state.nodes.map((node) => node.nodeId)
            }, 30000);
            (response.results || []).forEach((result, index) => {
              const node = state.nodes[index];
              if (!node) return;
              node.value = result.value;
              node.dataType = result.dataType;
              node.status = result.status;
              node.good = result.good;
              node.sourceTimestamp = result.sourceTimestamp;
            });
            renderWatch();
            const bad = (response.results || []).filter((result) => result.good === false);
            if (bad.length) toast(`${bad.length}/${state.nodes.length} nodes are not good quality`, "error");
          } catch (error) {
            toast(errorText(error), "error");
          } finally {
            state.busy = false;
          }
        }

        async function subscribe() {
          if (!state.nodes.length) return;
          try {
            if (state.subscriptionId !== null) await unsubscribe();
            const response = await invoke("opcua/subscribe", {
              connectionId, nodeIds: state.nodes.map((node) => node.nodeId), intervalMs: state.intervalMs
            }, 30000);
            state.subscriptionId = response.subscriptionId;
            subscribeButton.setAttribute("aria-pressed", "true");
            toast(`Subscribed ${state.nodes.length} node(s) every ${response.intervalMs} ms`, "info");
          } catch (error) {
            toast(errorText(error), "error");
          }
        }

        async function unsubscribe() {
          if (state.subscriptionId === null) return;
          const subscriptionId = state.subscriptionId;
          state.subscriptionId = null;
          subscribeButton.removeAttribute("aria-pressed");
          try {
            await invoke("opcua/unsubscribe", { connectionId, subscriptionId }, 20000);
          } catch (error) {
            toast(errorText(error), "error");
          }
        }

        async function writeNode(node) {
          const field = el("input", {
            type: "text", value: node.value === null || node.value === undefined ? "" : formatValue(node.value),
            placeholder: node.dataType && node.dataType !== "Null" ? node.dataType : "value"
          });
          const confirmed = await confirmDialog({
            title: t.writeTitleNode,
            body: t.confirmWriteBody,
            payload: node.nodeId,
            field, label: t.value,
            confirmLabel: t.confirm
          });
          if (confirmed === null) return;
          try {
            const response = await invoke("opcua/write", {
              connectionId,
              writes: [{ nodeId: node.nodeId, dataType: node.dataType || "Auto", value: parseScalar(field.value) }]
            }, 30000);
            const result = (response.results || [])[0];
            if (result && result.ok) {
              toast(`${node.nodeId}: ${result.status}`, "info");
              readAll();
            } else {
              toast((result && result.status) || "Write rejected", "error");
            }
          } catch (error) {
            toast(errorText(error), "error");
          }
        }

        // ---- live data changes -----------------------------------------------
        if (host.onEvent) {
          host.onEvent((event) => {
            if (!event || event.method !== "opcua/dataChange") return;
            const payload = event.params || {};
            if (payload.connectionId !== connectionId) return;
            const node = state.nodes.find((entry) => entry.nodeId === payload.nodeId);
            if (!node) return;
            node.value = payload.value;
            node.dataType = payload.dataType;
            node.status = payload.status;
            node.good = Number(payload.statusCode) === 0;
            node.sourceTimestamp = payload.sourceTimestamp;
            renderWatch();
          });
        }

        // ---- boot ------------------------------------------------------------
        (async () => {
          const saved = await readStorage(storageKey);
          if (Array.isArray(saved)) state.nodes = saved.map((node) => ({ ...node, good: false }));
          renderWatch();
          renderAttributes();
          await loadRoot();
          if (state.nodes.length) readAll();
        })();
      }

      // ---------------------------------------------------------------------
      // Bootstrap
      // ---------------------------------------------------------------------
      async function bootstrap() {
        await host.ready;
        locale = host.locale || locale;
        t = locale.toLowerCase().startsWith("zh") ? COPY.zh : COPY.en;

        const context = host.context || {};
        // The routing identity decides which workbench this page instance is.
        const isOpcua = (host.contributionId || "") === OPCUA_WORKBENCH;
        const other = isOpcua ? MODBUS_WORKBENCH : OPCUA_WORKBENCH;
        if ((host.contributionId || "") === other) {
          // Should not happen, but fail loudly rather than render the wrong UI.
          toast(`Unexpected contribution ${host.contributionId}`, "error");
        }

        document.querySelector("#title").textContent = isOpcua ? t.opcua : t.modbus;
        document.title = isOpcua ? t.opcua : t.modbus;

        const conn = document.querySelector("#conn");
        const connId = document.querySelector("#conn-id");
        connectionId = context.connectionId || context.connection_id || null;
        if (!connectionId) {
          conn.classList.add("dead");
          connId.textContent = t.notConnected;
          document.querySelector("#main").appendChild(el("div", { class: "empty", text: t.noConnection }));
          return;
        }
        conn.classList.add("live");
        connId.textContent = connectionId;
        connId.title = connectionId;

        // Both workbenches share one shape: configuration on the left, values
        // on the right.
        const main = document.querySelector("#main");
        if (isOpcua) createOpcuaWorkbench(main);
        else createModbusWorkbench(main);
      }

      window.addEventListener("dbx-plugin-env", (event) => {
        const detail = event.detail || {};
        if (detail.locale && String(detail.locale).toLowerCase().startsWith("zh") !== locale.toLowerCase().startsWith("zh")) {
          locale = detail.locale;
        }
      });

      bootstrap().catch((error) => {
        toast(errorText(error), "error");
      });
    </script>
  </body>
</html>
