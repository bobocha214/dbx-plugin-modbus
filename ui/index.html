<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EverLink</title>
    <style>
      /*
       * Styled with DBX's own design tokens. The host injects them on the
       * document root and keeps `data-dbx-theme` current, so every surface here
       * follows the surrounding application instead of imposing a look of its
       * own. Fallbacks match the host's light and dark palettes so the page is
       * still correct when opened outside DBX.
       *
       * Structure: configuration lives in the left sidebar and is switched
       * there; the right side is only ever a table of addresses and values.
       */

      /* ------------------------------------------------------------- tokens */
      :root {
        color-scheme: light dark;
        --dbx-bg: var(--color-background, #ffffff);
        --dbx-fg: var(--color-foreground, #27272a);
        --dbx-card: var(--color-card, #ffffff);
        --dbx-card-fg: var(--color-card-foreground, #27272a);
        --dbx-muted: var(--color-muted, #f4f4f5);
        --dbx-muted-fg: var(--color-muted-foreground, #71717a);
        --dbx-border: var(--color-border, #e4e4e7);
        --dbx-input: var(--color-input, #e4e4e7);
        --dbx-ring: var(--color-ring, #93c5fd);
        --dbx-primary: var(--color-primary, #2563eb);
        --dbx-primary-fg: var(--color-primary-foreground, #ffffff);
        --dbx-destructive: var(--color-destructive, #e7000b);
        --dbx-success: var(--color-success, #16a34a);
        --dbx-warning: var(--color-warning, #d97706);
        --dbx-radius: var(--radius-md, 6px);
        --dbx-radius-lg: var(--radius-lg, 8px);
        --dbx-font: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif);
        --dbx-mono: var(--font-mono, ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace);
        /* One hairline, reused everywhere so borders never disagree. */
        --dbx-line: 1px solid var(--dbx-border);
      }
      [data-dbx-theme="dark"] {
        --dbx-bg: var(--color-background, #18181b);
        --dbx-fg: var(--color-foreground, #f4f4f5);
        --dbx-card: var(--color-card, #1b1b1f);
        --dbx-card-fg: var(--color-card-foreground, #f4f4f5);
        --dbx-muted: var(--color-muted, #27272a);
        --dbx-muted-fg: var(--color-muted-foreground, #a1a1aa);
        --dbx-border: var(--color-border, #3f3f46);
        --dbx-input: var(--color-input, #3f3f46);
        --dbx-ring: var(--color-ring, #71717a);
        --dbx-primary: var(--color-primary, #60a5fa);
        --dbx-primary-fg: var(--color-primary-foreground, #18181b);
        --dbx-destructive: var(--color-destructive, #f3625f);
        --dbx-success: var(--color-success, #4ade80);
        --dbx-warning: var(--color-warning, #fbbf24);
      }

      /* -------------------------------------------------------------- reset */
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--dbx-bg);
        color: var(--dbx-fg);
        font-family: var(--dbx-font);
        font-size: 13px;
        line-height: 1.45;
        -webkit-font-smoothing: antialiased;
      }
      #app { display: flex; flex-direction: column; height: 100%; }
      .spacer { flex: 1; min-width: 0; }

      /* ------------------------------------------------------------- header */
      .app-header {
        display: flex; align-items: center; gap: 10px;
        flex: none; height: 44px; padding: 0 12px;
        border-bottom: var(--dbx-line);
        background: var(--dbx-card);
      }
      .brand { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; font-size: 13px; }
      .brand-dot {
        width: 8px; height: 8px; border-radius: 2px; flex: none;
        background: var(--dbx-primary);
      }
      .conn {
        display: inline-flex; align-items: center; gap: 6px;
        max-width: 300px; padding: 2px 8px;
        border: var(--dbx-line); border-radius: 999px;
        background: var(--dbx-muted);
        font-size: 11.5px; color: var(--dbx-muted-fg);
      }
      .conn .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--dbx-muted-fg); flex: none; }
      .conn.live .dot { background: var(--dbx-success); }
      .conn.dead .dot { background: var(--dbx-destructive); }
      .conn .id { font-family: var(--dbx-mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .header-extra { display: inline-flex; align-items: center; gap: 8px; }

      /* ------------------------------------------------------------ controls */
      button, select, input {
        font: inherit; color: var(--dbx-fg);
        background: var(--dbx-card);
        border: 1px solid var(--dbx-input);
        border-radius: var(--dbx-radius);
        padding: 0 8px; height: 28px;
      }
      select { padding-right: 4px; }
      input { min-width: 0; }
      button { cursor: pointer; white-space: nowrap; font-size: 12.5px; }
      button:hover:not(:disabled) { background: var(--dbx-muted); }
      button:disabled { opacity: .45; cursor: not-allowed; }
      button.primary {
        background: var(--dbx-primary); color: var(--dbx-primary-fg);
        border-color: transparent; font-weight: 500;
      }
      button.primary:hover:not(:disabled) { background: var(--dbx-primary); filter: brightness(.94); }
      button.ghost { background: transparent; border-color: transparent; }
      button.ghost:hover:not(:disabled) { background: var(--dbx-muted); }
      button.icon { width: 28px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
      button.danger { color: var(--dbx-destructive); }
      button[aria-pressed="true"] {
        background: var(--dbx-muted);
        border-color: var(--dbx-primary);
        color: var(--dbx-primary);
        font-weight: 500;
      }
      input:focus-visible, select:focus-visible, button:focus-visible, [tabindex]:focus-visible {
        outline: 2px solid var(--dbx-ring); outline-offset: 1px;
      }
      ::placeholder { color: var(--dbx-muted-fg); }

      /* Counters in the header: label and value on one baseline. */
      .stat-row { display: inline-flex; align-items: center; gap: 0; }
      .stat {
        display: inline-flex; align-items: baseline; gap: 5px;
        padding: 0 9px; height: 22px;
      }
      .stat + .stat { border-left: var(--dbx-line); }
      .stat .k {
        font-size: 10px; text-transform: uppercase; letter-spacing: .05em;
        color: var(--dbx-muted-fg);
      }
      .stat .v {
        font-family: var(--dbx-mono); font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      .stat .v.bad { color: var(--dbx-destructive); }
      .stat .v.good { color: var(--dbx-success); }

      /* ---------------------------------------------------------- workspace */
      .workspace { flex: 1; min-height: 0; display: flex; }

      /* The sidebar holds the configuration: the list you switch between on
         top, the selected item's settings below. */
      .sidebar {
        flex: 0 0 300px; min-width: 0; display: flex; flex-direction: column;
        border-right: var(--dbx-line); background: var(--dbx-card);
      }
      .sidebar-head {
        display: flex; align-items: center; gap: 8px;
        flex: none; height: 36px; padding: 0 10px 0 12px;
        border-bottom: var(--dbx-line);
      }
      .sidebar-head .tabs { display: flex; gap: 2px; flex: 1; min-width: 0; }
      .tab {
        height: 26px; padding: 0 11px; font-size: 12px;
        background: transparent; border-color: transparent;
        color: var(--dbx-muted-fg);
      }
      .tab:hover:not([aria-selected="true"]) { background: var(--dbx-muted); }
      .tab[aria-selected="true"] {
        background: var(--dbx-muted); color: var(--dbx-fg); font-weight: 500;
      }
      .sidebar-head .label {
        font-size: 10.5px; font-weight: 600; letter-spacing: .06em;
        text-transform: uppercase; color: var(--dbx-muted-fg);
      }
      .scope-list {
        flex: 0 1 auto; max-height: 44%; overflow: auto;
        padding: 6px; border-bottom: var(--dbx-line);
      }
      .scope-item {
        display: flex; align-items: center; gap: 8px;
        padding: 6px 8px; border-radius: var(--dbx-radius);
        cursor: pointer; min-width: 0;
      }
      .scope-item + .scope-item { margin-top: 1px; }
      .scope-item:hover { background: var(--dbx-muted); }
      .scope-item.active { background: var(--dbx-muted); }
      .scope-item.active .scope-name { color: var(--dbx-fg); font-weight: 500; }
      /* A left rail marks the selected scope without relying on the fill alone. */
      .scope-item.active { box-shadow: inset 2px 0 0 var(--dbx-primary); }
      .scope-item .scope-dot {
        width: 6px; height: 6px; border-radius: 50%; flex: none;
        background: transparent; border: 1px solid var(--dbx-border);
      }
      .scope-item .scope-dot.ok { background: var(--dbx-success); border-color: transparent; }
      .scope-item .scope-dot.warn { background: var(--dbx-warning); border-color: transparent; }
      .scope-item .scope-dot.bad { background: var(--dbx-destructive); border-color: transparent; }
      .scope-body { display: flex; flex-direction: column; min-width: 0; flex: 1; }
      .scope-name {
        font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .scope-meta {
        font-size: 10.5px; color: var(--dbx-muted-fg);
        font-family: var(--dbx-mono);
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .scope-item .scope-del { opacity: 0; flex: none; }
      .scope-item:hover .scope-del { opacity: 1; }

      /* ------------------------------------------------------- config form */
      /* A narrow column of settings: sections divided by a hairline so the
         grouping is visible without boxes, and paired controls sharing a row
         where the two settings belong together. */
      .config { flex: 1; min-height: 0; overflow: auto; padding: 12px 13px 20px; }
      .config-section + .config-section {
        margin-top: 15px; padding-top: 14px;
        border-top: var(--dbx-line);
      }
      .config-section > .title {
        font-size: 10px; font-weight: 600; letter-spacing: .07em;
        text-transform: uppercase; color: var(--dbx-muted-fg);
        margin-bottom: 8px;
      }
      .form-row { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
      .form-row + .form-row { margin-top: 9px; }
      .form-row > label {
        font-size: 11.5px; color: var(--dbx-muted-fg);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .form-row > input, .form-row > select { width: 100%; height: 30px; }
      /* Two controls sharing a row, as start/quantity naturally pair. */
      .form-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 9px; }
      .form-pair .form-row + .form-row { margin-top: 0; }
      /* Device connection state, shown in the form as colour and words. */
      .device-status { font-size: 12px; line-height: 1.5; }
      .device-status.ok { color: var(--dbx-success); }
      .device-status.bad { color: var(--dbx-destructive); }
      .device-status.warn { color: var(--dbx-warning); }
      .device-error {
        margin-top: 4px; font-size: 11px; line-height: 1.5;
        color: var(--dbx-destructive); word-break: break-word;
      }
      .button-row { display: flex; gap: 6px; margin-top: 10px; }
      .button-row button { flex: 1; padding: 0 8px; }
      .empty-list {
        padding: 14px 12px; font-size: 12px; line-height: 1.5;
        color: var(--dbx-muted-fg);
      }

      .config .note {
        margin-top: 8px; font-size: 11px; line-height: 1.5;
        color: var(--dbx-muted-fg); font-family: var(--dbx-mono);
      }

      /* ----------------------------------------------------------- content */
      .content { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--dbx-bg); }
      .content-head {
        display: flex; align-items: center; gap: 12px; flex: none;
        min-height: 40px; padding: 6px 14px;
        border-bottom: var(--dbx-line);
      }
      .content-title { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
      .content-title h2 { margin: 0; font-size: 13px; font-weight: 600; }
      .content-title .count {
        font-size: 11.5px; color: var(--dbx-muted-fg); font-family: var(--dbx-mono);
      }
      /* The decoded value belongs to the whole range, so it sits beside the
         range label rather than inside any single row. */
      .decoded { display: flex; align-items: baseline; gap: 8px; min-width: 0; overflow: hidden; }
      .decoded .k {
        font-size: 10px; text-transform: uppercase; letter-spacing: .05em;
        color: var(--dbx-muted-fg); flex: none;
      }
      .decoded .v {
        font-family: var(--dbx-mono); font-variant-numeric: tabular-nums;
        font-size: 14px; font-weight: 600;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .decoded .m { font-size: 11px; color: var(--dbx-muted-fg); flex: none; font-family: var(--dbx-mono); }

      .table-wrap { flex: 1; min-height: 0; overflow: auto; }
      table { border-collapse: separate; border-spacing: 0; width: 100%; }
      th, td {
        text-align: left; padding: 0 12px; height: 30px;
        white-space: nowrap; vertical-align: middle;
      }
      th {
        position: sticky; top: 0; z-index: 2;
        background: var(--dbx-muted);
        border-bottom: var(--dbx-line);
        font-size: 10.5px; font-weight: 600; letter-spacing: .06em;
        text-transform: uppercase; color: var(--dbx-muted-fg);
      }
      tbody td { border-bottom: 1px solid color-mix(in srgb, var(--dbx-border) 55%, transparent); }
      tbody tr:hover { background: var(--dbx-muted); }
      td.val { font-family: var(--dbx-mono); font-variant-numeric: tabular-nums; font-size: 12.5px; }
      td.note { color: var(--dbx-muted-fg); font-size: 11.5px; }

      /* ------------------------------------------------- address/value grid */
      /* One cell per address, laid out in as many columns as the configuration
         asks for, so a wide window shows several registers per row instead of
         one long list. */
      .grid-wrap { flex: 1; min-height: 0; overflow: auto; }
      .value-grid {
        display: grid;
        grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr));
        gap: 5px; padding: 10px 12px 18px; align-content: start;
      }
      .av {
        display: flex; align-items: baseline; gap: 7px;
        min-width: 0; padding: 4px 8px;
        border: 1px solid color-mix(in srgb, var(--dbx-border) 70%, transparent);
        border-radius: var(--dbx-radius);
        background: var(--dbx-card);
      }
      .av:hover {
        background: var(--dbx-muted);
        border-color: var(--dbx-border);
      }
      .av .a {
        flex: none; font-family: var(--dbx-mono); font-size: 11px;
        color: var(--dbx-muted-fg); font-variant-numeric: tabular-nums;
      }
      /* Inside a cell the value sits next to its address, while the hex is
         right-aligned in a fixed gutter so it lines up down the grid. */
      .av .cell-value {
        margin: 0 0 0 2px; padding: 1px 4px; flex: none;
        font-family: var(--dbx-mono); font-size: 12.5px; font-weight: 500;
        font-variant-numeric: tabular-nums;
      }
      .av .cell-value.muted { color: var(--dbx-muted-fg); font-weight: 400; }
      .av .r {
        margin-left: auto; min-width: 50px; text-align: right;
        flex: none; font-family: var(--dbx-mono); font-size: 10px;
        color: var(--dbx-muted-fg); font-variant-numeric: tabular-nums;
        overflow: hidden; text-overflow: ellipsis;
      }

      /* Paging controls, shown only when a range does not fit on one page. */
      .pager { display: flex; align-items: center; gap: 1px; flex: none; }
      .pager button { width: 24px; height: 24px; padding: 0; font-size: 13px; }
      .pager .page-info {
        min-width: 46px; text-align: center;
        font-family: var(--dbx-mono); font-size: 11.5px;
        font-variant-numeric: tabular-nums; color: var(--dbx-muted-fg);
      }

      /* How many cells per row and per page. These are view controls, so they
         live beside the data rather than buried in the configuration form. */
      .view-controls {
        display: flex; align-items: center; gap: 6px; flex: none;
        padding-left: 10px; border-left: var(--dbx-line);
      }
      .view-controls label {
        display: inline-flex; align-items: center; gap: 4px;
        font-size: 11px; color: var(--dbx-muted-fg); white-space: nowrap;
      }
      .view-controls input { width: 44px; height: 26px; padding: 0 4px; text-align: center; }
      .muted { color: var(--dbx-muted-fg); }
      .bad { color: var(--dbx-destructive); }
      .good { color: var(--dbx-success); }

      /* The value is the only editable thing in a row, so it is the only thing
         that reacts to the pointer. */
      .cell-value {
        display: inline-block; min-width: 44px;
        padding: 1px 6px; margin: 0 -6px;
        border-radius: 4px; cursor: pointer;
      }
      .cell-value:hover {
        background: color-mix(in srgb, var(--dbx-primary) 12%, transparent);
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--dbx-primary) 45%, transparent);
      }
      .cell-value.readonly { cursor: default; }
      .cell-value.readonly:hover { background: transparent; box-shadow: none; }

      /* Bits read as a state, not a number: dot plus label. */
      .bit { display: inline-flex; align-items: center; gap: 6px; }
      .bit i {
        width: 6px; height: 6px; border-radius: 50%; flex: none;
        background: var(--dbx-border);
      }
      .bit.on i { background: var(--dbx-success); }
      /* No value yet: an outlined dot rather than a filled "off", so an unread
         address cannot be mistaken for a cleared coil. */
      .bit.unknown i { background: transparent; border: 1px solid var(--dbx-border); }

      .empty {
        padding: 34px 20px; text-align: center;
        color: var(--dbx-muted-fg); line-height: 1.6; font-size: 12.5px;
      }

      /* ---------------------------------------------------------- read log */
      /* A drawer under the data: what was read, from which device, and — when
         it failed — the exact reason the backend gave. */
      .log-panel {
        flex: 0 0 auto; display: flex; flex-direction: column;
        max-height: 220px; border-top: var(--dbx-line);
        background: var(--dbx-card);
      }
      .log-head {
        display: flex; align-items: center; gap: 8px; flex: none;
        height: 30px; padding: 0 10px 0 14px;
        background: var(--dbx-muted);
        border-bottom: var(--dbx-line);
      }
      .log-head .title {
        font-size: 10.5px; font-weight: 600; letter-spacing: .06em;
        text-transform: uppercase; color: var(--dbx-muted-fg);
      }
      .log-head .count {
        font-family: var(--dbx-mono); font-size: 11px; color: var(--dbx-muted-fg);
      }
      .log-head button { height: 22px; padding: 0 8px; font-size: 11.5px; }
      .log-rows { overflow: auto; }
      .log-row {
        display: grid;
        grid-template-columns: 68px minmax(80px, 140px) 104px 62px 1fr 62px;
        gap: 10px; align-items: baseline;
        padding: 4px 14px; font-size: 11.5px;
        border-bottom: 1px solid color-mix(in srgb, var(--dbx-border) 45%, transparent);
      }
      .log-row:hover { background: var(--dbx-muted); }
      .log-row .t, .log-row .d {
        font-family: var(--dbx-mono); font-variant-numeric: tabular-nums;
        color: var(--dbx-muted-fg);
      }
      .log-row .dev, .log-row .rng {
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .log-row .rng { font-family: var(--dbx-mono); color: var(--dbx-muted-fg); }
      .log-row .res { font-weight: 500; }
      .log-row .res.ok { color: var(--dbx-success); }
      .log-row .res.bad { color: var(--dbx-destructive); }
      .log-row .msg {
        white-space: normal; word-break: break-word; line-height: 1.4;
        color: var(--dbx-muted-fg);
      }
      .log-row.failed .msg { color: var(--dbx-destructive); }
      .log-row .cnt { color: var(--dbx-muted-fg); font-size: 10.5px; }
      .log-empty { padding: 18px 14px; color: var(--dbx-muted-fg); font-size: 12px; }
      .hint {
        flex: none; padding: 7px 12px; font-size: 11.5px; line-height: 1.5;
        color: var(--dbx-muted-fg); border-top: var(--dbx-line);
      }
      .error-bar {
        flex: none; padding: 7px 14px; font-size: 12px;
        color: var(--dbx-destructive);
        background: color-mix(in srgb, var(--dbx-destructive) 9%, transparent);
        border-bottom: var(--dbx-line);
      }

      /* ------------------------------------------------------------- splitter */
      .splitter {
        flex: 0 0 5px; cursor: col-resize; background: transparent;
        position: relative; margin: 0 -2px; z-index: 3;
      }
      .splitter::after {
        content: ""; position: absolute; inset: 0 2px;
        background: var(--dbx-primary); opacity: 0; transition: opacity .12s;
      }
      .splitter:hover::after, .splitter.dragging::after { opacity: .5; }
      body.resizing { cursor: col-resize; user-select: none; }

      /* ---------------------------------------------------------------- tree */
      .tree { padding: 4px; }
      .tree-row {
        display: flex; align-items: center; gap: 4px;
        padding: 3px 6px; border-radius: var(--dbx-radius);
        cursor: pointer; white-space: nowrap; font-size: 12.5px;
      }
      .tree-row:hover { background: var(--dbx-muted); }
      .tree-row.selected { background: color-mix(in srgb, var(--dbx-primary) 14%, transparent); }
      .tree-row.dim { opacity: .45; }
      .tree-row.highlight .name { font-weight: 600; }
      .twisty {
        width: 12px; flex: none; text-align: center; font-size: 9px;
        color: var(--dbx-muted-fg);
      }
      .nclass {
        width: 14px; flex: none; text-align: center;
        font-family: var(--dbx-mono); font-size: 10px; color: var(--dbx-muted-fg);
      }
      .nclass.object { color: var(--dbx-primary); }
      .nclass.variable { color: var(--dbx-success); }
      .nclass.method { color: #9333ea; }
      .nclass.view { color: #0891b2; }
      .nclass.type { color: #d97706; }
      [data-dbx-theme="dark"] .nclass.method { color: #c084fc; }
      [data-dbx-theme="dark"] .nclass.view { color: #22d3ee; }
      [data-dbx-theme="dark"] .nclass.type { color: #fbbf24; }
      .tree .name { overflow: hidden; text-overflow: ellipsis; }

      /* ------------------------------------------------------------ attributes */
      .attrs-panel { flex: 0 0 auto; max-height: 40%; display: flex; flex-direction: column; border-top: var(--dbx-line); }
      .attrs-head {
        flex: none; display: flex; align-items: center; gap: 8px;

          writeHint: "双击数值即可写入；只读区域不可编辑。",
          start: "起始地址", scope: "范围", config: "配置",

          narrowType: "仅对占用四个寄存器的 64 位类型有效。",

          nameLabel: "名称", on: "ON", off: "OFF",
          columns: "列数", rows: "行数",
          prevPage: "上一页", nextPage: "下一页",
          devices: "设备", device: "设备", tabDevices: "设备", tabRanges: "配置",
          addDevice: "添加设备", deviceName: "名称", groupDevice: "地址",
          host: "IP 地址", port: "端口", deviceTimeout: "超时（毫秒）",
          groupConnection: "连接", connect: "连接", disconnect: "断开",
          reconnect: "重连", deleteDevice: "删除",
          deviceOpen: "已连接", deviceOpening: "连接中…",
          deviceIdle: "未连接", deviceError: "无法连接",
          noDevices: "还没有设备。", noDevice: "无设备",
          deviceInUse: "该设备仍被配置引用",
          emptyList: "暂无内容。",
          logButton: "日志", logTitle: "读取日志", logEmpty: "还没有读取记录。",
          logClear: "清空", logClose: "关闭日志", logCount: "条",
          logOk: "成功", logFailed: "失败",
          holding: "保持寄存器", input: "输入寄存器", coil: "线圈", discrete: "离散输入",
          readOnlyArea: "只读"
        }
      };
      let t = COPY.en;

      // ---------------------------------------------------------------------
      // Helpers
      // ---------------------------------------------------------------------
      function el(tag, props, children) {
        const node = document.createElement(tag);
        for (const [key, value] of Object.entries(props || {})) {
          if (value === null || value === undefined) continue;
          if (key === "class") node.className = value;
          else if (key === "text") node.textContent = value;
          else if (key === "style") node.setAttribute("style", value);
          else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
          else node.setAttribute(key, value);
        }
        for (const child of [].concat(children || [])) {
          if (child) node.appendChild(child);
        }
        return node;
      }

      function toast(message, kind) {
        const node = el("div", { class: "toast" + (kind ? " " + kind : ""), text: message });
        document.querySelector("#toast").appendChild(node);
        setTimeout(() => node.remove(), kind === "error" ? 9000 : 3500);
      }

      /** Modal confirm: alert/confirm/prompt are unavailable in the sandbox. */
      function confirmDialog(options) {
        return new Promise((resolve) => {
          const dialog = el("dialog");
          dialog.appendChild(el("h3", { text: options.title }));
          if (options.body) dialog.appendChild(el("p", { text: options.body }));
          if (options.payload) dialog.appendChild(el("div", { class: "payload", text: options.payload }));
          if (options.field) dialog.appendChild(el("div", { class: "row" }, [options.label && el("label", { text: options.label }), options.field]));
          else if (options.fieldNode) dialog.appendChild(el("div", { class: "row" }, [options.fieldNode]));
          dialog.appendChild(el("div", { class: "actions" }, [
            el("button", { text: t.cancel, onclick: () => { dialog.close(); resolve(null); } }),
            el("button", { class: "primary", text: options.confirmLabel || t.confirm,
              onclick: () => { dialog.close(); resolve(options.field ? options.field.value : true); } })
          ]));
          dialog.addEventListener("close", () => dialog.remove());
          document.body.appendChild(dialog);
          dialog.showModal();
          if (options.field) { options.field.focus(); options.field.select && options.field.select(); }
        });
      }

      function invoke(method, params, timeoutMs) {
        return host.invoke(method, params, { timeoutMs: timeoutMs || 30000 });
      }

      function errorText(error) {
        return String(error && error.message ? error.message : error);
      }

      function formatValue(value) {
        if (value === null || value === undefined) return "—";
        if (typeof value === "number") {
          if (Number.isInteger(value)) return String(value);
          return String(Number(value.toPrecision(8)));
        }
        if (typeof value === "object") {
          if (typeof value.byteLength === "number") return `[${value.byteLength} bytes]`;
          return JSON.stringify(value);
        }
        return String(value);
      }

      function parseScalar(text) {
        const trimmed = String(text).trim();
        if (trimmed === "true") return true;
        if (trimmed === "false") return false;
        if (trimmed !== "" && trimmed !== "-" && !Number.isNaN(Number(trimmed))) return Number(trimmed);
        return trimmed;
      }

      /** Renders a 16-bit register in the selected display format. */
      function formatRegister(value, format) {
        if (value === null || value === undefined) return "—";
        const word = ((Number(value) % 65536) + 65536) % 65536;
        switch (format) {
          case "signed": return String(word >= 32768 ? word - 65536 : word);
          case "hex": return "0x" + word.toString(16).toUpperCase().padStart(4, "0");
          case "binary": return word.toString(2).padStart(16, "0");
          default: return String(word);
        }
      }

      /** Five-digit, zero-padded address, as PLC documentation prints it. */
      function formatAddress(address) {
        return String(address).padStart(5, "0");
      }

      // How many 16-bit registers each data type occupies, and how to read the
      // assembled bytes back out. Mirrors the backend's decoder so a display
      // option can be applied without another round-trip to the device.
      const TYPE_LAYOUT = {
        uint16: ["u", 2], int16: ["i", 2],
        uint32: ["u", 4], int32: ["i", 4], float32: ["f", 4],
        uint64: ["u", 8], int64: ["i", 8], float64: ["f", 8]
      };

      /** How many registers a decoded value spans, or 1 for an unknown type. */
      function registerCount(dataType) {
        const layout = TYPE_LAYOUT[dataType];
        return layout ? layout[1] / 2 : 1;
      }

      /**
       * Reassembles registers into a value using the selected byte and word
       * order. Byte order names the position of each byte of a single 16-bit
       * register (ABCD/BADC) or swaps whole words (CDAB/DCBA); word order then
       * orders the words for values wider than 32 bits.
       */
      function decodeRegistersClient(registers, dataType, byteOrder, wordOrder) {
        const layout = TYPE_LAYOUT[dataType];
        if (!layout || !registers || !registers.length) return undefined;
        const [kind, byteWidth] = layout;
        const need = byteWidth / 2;
        if (registers.length < need) return undefined;

        const words = registers.slice(0, need).map((value) => ((Number(value) % 65536) + 65536) % 65536);
        // Order the words widest-first, honouring the word order for 64-bit
        // types and the CDAB/DCBA byte orders which are really word swaps.
        let ordered = words;
        if (byteOrder === "CDAB" && need >= 2) {
          ordered = words.slice().reverse();
        } else if (byteOrder === "DCBA" && need >= 2) {
          ordered = words.slice().reverse().map((word) => ((word & 0xff) << 8) | (word >> 8));
        }
        if (wordOrder === "little" && need >= 4) ordered = ordered.slice().reverse();

        // Flatten to a byte array, applying the per-register byte order.
        const bytes = [];
        for (const word of ordered) {
          let hi = (word >> 8) & 0xff;
          let lo = word & 0xff;
          if (byteOrder === "BADC" || byteOrder === "DCBA") {
            const swap = hi; hi = lo; lo = swap;
          }
          bytes.push(hi, lo);
        }

        const view = new DataView(new Uint8Array(bytes).buffer);
        if (kind === "f") {
          return byteWidth === 4 ? view.getFloat32(0, false) : view.getFloat64(0, false);
        }
        if (kind === "i") {
          if (byteWidth === 2) return view.getInt16(0, false);
          if (byteWidth === 4) return view.getInt32(0, false);
          return Number(view.getBigInt64(0, false));
        }
        if (byteWidth === 2) return view.getUint16(0, false);
        if (byteWidth === 4) return view.getUint32(0, false);
        return Number(view.getBigUint64(0, false));
      }

      function storageKeyFor(kind) {
        return `${kind}.${connectionId || "default"}`;
      }

      function hasStorage() {
        return !!(host.capabilities && host.capabilities.storage && host.storage);
      }

      // Persisted state keeps only the user's definitions. A live read result is
      // stale the moment it is written, and `storage` caps a single value at
      // 256 KiB, which a 2000-register dump would exceed.
      function persistable(items, definitionKeys) {
        return items.map((item) => {
          const kept = {};
          for (const key of definitionKeys) {
            if (item[key] !== undefined) kept[key] = item[key];
          }
          return kept;
        });
      }

      /** The same whitelist rule for a single object, not a list of them. */
      function persistableOne(source, definitionKeys) {
        return persistable([source], definitionKeys)[0];
      }

      function readStorage(key) {
        if (!hasStorage()) return Promise.resolve(null);
        return host.storage.get(key).catch(() => null);
      }

      function writeStorage(key, value) {
        if (!hasStorage()) return;
        host.storage.set(key, value).catch(() => {});
      }

      /** A labelled readout for the header counters. */
      function stat(label, initial) {
        const value = el("span", { class: "v", text: initial === undefined ? "—" : String(initial) });
        const node = el("div", { class: "stat" }, [
          el("span", { class: "k", text: label }),
          value
        ]);
        return { node, set: (text, kind) => { value.textContent = text; value.className = "v" + (kind ? " " + kind : ""); } };
      }

      /**
       * A draggable divider that reallocates width between two flex children.
       *
       * `before` keeps its share until dragging starts; from then on both panes
       * carry explicit flex-basis in pixels, so a pane can never be collapsed
       * to nothing (MIN_PANE) and the layout survives a resize.
       */
      function createSplitter(container, before, after) {
        const MIN_PANE = 180;
        const splitter = el("div", { class: "splitter", title: "Drag to resize" });
        let dragging = false;

        const onMove = (event) => {
          if (!dragging) return;
          const bounds = container.getBoundingClientRect();
          const x = (event.touches ? event.touches[0].clientX : event.clientX) - bounds.left;
          const width = Math.max(MIN_PANE, Math.min(bounds.width - MIN_PANE - splitter.offsetWidth, x));
          before.style.flex = `0 0 ${width}px`;
          after.style.flex = `1 1 auto`;
          event.preventDefault();
        };
        const stop = () => {
          if (!dragging) return;
          dragging = false;
          splitter.classList.remove("dragging");
          document.body.classList.remove("resizing");
          window.removeEventListener("mousemove", onMove);
          window.removeEventListener("mouseup", stop);
          window.removeEventListener("touchmove", onMove);
          window.removeEventListener("touchend", stop);
        };
        const start = (event) => {
          dragging = true;
          splitter.classList.add("dragging");
          document.body.classList.add("resizing");
          window.addEventListener("mousemove", onMove);
          window.addEventListener("mouseup", stop);
          window.addEventListener("touchmove", onMove, { passive: false });
          window.addEventListener("touchend", stop);
          event.preventDefault();
        };

        splitter.addEventListener("mousedown", start);
        splitter.addEventListener("touchstart", start, { passive: false });
        // Keyboard access: arrow keys nudge the divider like a real splitter.
        splitter.setAttribute("tabindex", "0");
        splitter.setAttribute("role", "separator");
        splitter.addEventListener("keydown", (event) => {
          const step = event.key === "ArrowLeft" ? -24 : event.key === "ArrowRight" ? 24 : 0;
          if (!step) return;
          const current = before.getBoundingClientRect().width;
          const bounds = container.getBoundingClientRect();
          const width = Math.max(MIN_PANE, Math.min(bounds.width - MIN_PANE, current + step));
          before.style.flex = `0 0 ${width}px`;
          after.style.flex = "1 1 auto";
          event.preventDefault();
        });
        return splitter;
      }

      // ---------------------------------------------------------------------
      // Modbus TCP workbench
      // ---------------------------------------------------------------------
      // The four addressable areas, in the order the protocol numbers them.
      const AREAS = ["holding", "input", "coil", "discrete"];
      const DATA_TYPES = ["uint16", "int16", "uint32", "int32", "float32", "uint64", "int64", "float64"];
      // "default" is deliberately absent: the connection no longer carries a
      // byte order, so every read names one explicitly.
      const BYTE_ORDERS = ["ABCD", "BADC", "CDAB", "DCBA"];
      const FORMATS = ["unsigned", "signed", "hex", "binary"];

      /** Function codes that address an area, for labels and the read path. */
      function functionCode(area, forWrite) {
        const table = {
          coil: forWrite ? "05/15" : "01",
          discrete: "02",
          holding: forWrite ? "06/16" : "03",
          input: "04"
        };
        return table[area] || "—";
      }

      function isBitArea(area) {
        return area === "coil" || area === "discrete";
      }

      function areaLabel(area) {
        return `${t[area] || area} · FC${functionCode(area, false)}`;
      }

      // ---------------------------------------------------------------------
      // Devices and ranges
      //
      // A workbench can talk to several devices at once, so each one gets its
      // own session in the backend (`device:<id>`) and its own status. Every
      // range names the device it reads from, which is what lets a list of
      // ranges span more than one PLC.
      // ---------------------------------------------------------------------
      const DEVICE_KEY_PREFIX = "device:";
      const DEVICE_DEFAULTS = { name: "", host: "", port: 502, unitId: 1, timeoutMs: 3000 };
      // Exactly the definition keys; status, latency and the retry timer are
      // runtime state and are never written.
      const DEVICE_KEYS = ["id", ...Object.keys(DEVICE_DEFAULTS)];

      // One configuration per range. Each remembers what it last read, so
      // switching between them does not blank the display.
      const SCOPE_DEFAULTS = {
        deviceId: "", area: "holding", start: 0, quantity: 32,
        dataType: "uint16", byteOrder: "ABCD", wordOrder: "big",
        format: "unsigned", intervalMs: 1000, name: "",
        // How the values are laid out. Columns × rows is one page; a range
        // larger than that is paged rather than scrolled, so the same number of
        // addresses is always visible while polling.
        columns: 4, rows: 8
      };
      // `page` is deliberately absent — where you are looking is not a setting.
      const SCOPE_KEYS = ["id", ...Object.keys(SCOPE_DEFAULTS)];
      const MAX_COLUMNS = 6;
      const MAX_ROWS = 50;

      function newId() {
        return Math.random().toString(36).slice(2, 10);
      }

      function newDevice(patch) {
        return {
          id: newId(),
          // Runtime only.
          status: "idle", latencyMs: null, error: null, retryTimer: null, retryDelay: 0,
          ...DEVICE_DEFAULTS,
          ...(patch || {})
        };
      }

      function newScope(patch) {
        return { id: newId(), result: null, page: 0, ...SCOPE_DEFAULTS, ...(patch || {}) };
      }

      function deviceLabel(device) {
        if (!device) return "";
        return (device.name && device.name.trim()) || device.host || t.devices;
      }

      function deviceEndpoint(device) {
        return device ? `${device.host}:${device.port}` : "";
      }

      /** `Holding 0 – 31` when the user has not named the range themselves. */
      function scopeTitle(scope) {
        if (scope.name && scope.name.trim()) return scope.name.trim();
        const end = scope.start + Math.max(1, scope.quantity) - 1;
        return `${t[scope.area] || scope.area} ${scope.start} – ${end}`;
      }

      /** Cells one page can hold. */
      function pageCapacity(scope) {
        return Math.max(1, Number(scope.columns) || 1) * Math.max(1, Number(scope.rows) || 1);
      }

      function pageCount(scope) {
        return Math.max(1, Math.ceil(Math.max(1, scope.quantity) / pageCapacity(scope)));
      }

      // A device that answered with a Modbus exception is still a device that
      // answered, so only transport-shaped failures count as a lost connection.
      const TRANSPORT_HINTS = [
        /^connect/i, /timed out/i, /connection/i, /socket/i, /broken pipe/i,
        /reset by peer/i, /read response/i, /write request/i, /write response/i,
        /cannot resolve/i, /no address/i
      ];

      function isTransportError(message) {
        const text = String(message || "");
        if (/^Modbus exception/i.test(text)) return false;
        return TRANSPORT_HINTS.some((pattern) => pattern.test(text));
      }

      function createModbusWorkbench(root) {
        const scopeKey = storageKeyFor("modbus.scopes");
        const deviceKey = storageKeyFor("modbus.devices");
        const legacyKey = storageKeyFor("modbus.scope");
        const state = {
          devices: [], scopes: [], activeId: null, selectedDeviceId: null,
          tab: "ranges", busy: false, timer: null, tx: 0, err: 0,
          // Read history is diagnostic, so it lives in memory only.
          log: [], logOpen: false
        };

        const active = () => state.scopes.find((scope) => scope.id === state.activeId) || state.scopes[0];
        const deviceById = (id) => state.devices.find((device) => device.id === id) || null;
        const selectedDevice = () => deviceById(state.selectedDeviceId) || state.devices[0] || null;
        const deviceOf = (scope) => deviceById(scope && scope.deviceId) || state.devices[0] || null;
        const sessionId = (device) => DEVICE_KEY_PREFIX + device.id;

        // ---- header counters and device state -------------------------------
        const sTx = stat(t.tx, 0);
        const sErr = stat(t.err, 0);
        const counters = el("div", { class: "stat-row" }, [sTx.node, sErr.node]);

        const readButton = el("button", { class: "primary", text: t.readOnce, onclick: () => readActive() });
        const pollButton = el("button", { text: t.poll, onclick: () => togglePolling() });
        const logButton = el("button", {
          text: t.logButton, title: t.logTitle,
          "aria-pressed": "false", onclick: () => toggleLog()
        });
        document.querySelector("#appbar-extra").append(logButton, counters, readButton, pollButton);

        // ---- sidebar: two tabs over one panel -------------------------------
        const deviceTab = el("button", { class: "tab", text: t.tabDevices, onclick: () => setTab("devices") });
        const rangeTab = el("button", { class: "tab", text: t.tabRanges, onclick: () => setTab("ranges") });
        const addButton = el("button", { class: "icon ghost", text: "+", onclick: () => addCurrent() });
        const sidebarHead = el("div", { class: "sidebar-head" }, [
          el("div", { class: "tabs", role: "tablist" }, [deviceTab, rangeTab]),
          el("span", { class: "spacer" }),
          addButton
        ]);

        const deviceList = el("div", { class: "scope-list device-list" });
        const scopeList = el("div", { class: "scope-list range-list" });
        const configForm = el("div", { class: "config" });
        const sidebar = el("aside", { class: "sidebar" }, [sidebarHead, deviceList, scopeList, configForm]);

        // ---- content: only addresses and values -----------------------------
        const valueGrid = el("div", { class: "value-grid" });
        const gridWrap = el("div", { class: "grid-wrap" }, [valueGrid]);
        const errorBar = el("div", { class: "error-bar", style: "display:none" });

        const rangeLabel = el("span", { class: "count" });
        const pageInfo = el("span", { class: "page-info" });
        const prevButton = el("button", {
          class: "icon ghost", text: "‹", title: t.prevPage, onclick: () => turnPage(-1)
        });
        const nextButton = el("button", {
          class: "icon ghost", text: "›", title: t.nextPage, onclick: () => turnPage(1)
        });
        const pager = el("div", { class: "pager" }, [prevButton, pageInfo, nextButton]);

        const columnsInput = el("input", {
          type: "number", min: "1", max: String(MAX_COLUMNS), title: t.columns,
          onchange: (event) => setLayout("columns", event.target.value, 1, MAX_COLUMNS, event.target)
        });
        const rowsInput = el("input", {
          type: "number", min: "1", max: String(MAX_ROWS), title: t.rows,
          onchange: (event) => setLayout("rows", event.target.value, 1, MAX_ROWS, event.target)
        });
        const viewControls = el("div", { class: "view-controls" }, [
          el("label", {}, [el("span", { text: t.columns }), columnsInput]),
          el("label", {}, [el("span", { text: t.rows }), rowsInput])
        ]);

        const decodedLabel = el("span", { class: "k", text: t.decoded });
        const decodedValue = el("span", { class: "v" });
        const decodedMeta = el("span", { class: "m" });
        const decodedBox = el("div", { class: "decoded" }, [decodedLabel, decodedValue, decodedMeta]);

        const contentHead = el("div", { class: "content-head" }, [
          el("div", { class: "content-title" }, [el("h2", { text: t.addresses }), rangeLabel]),
          el("span", { class: "spacer" }),
          viewControls,
          pager,
          decodedBox
        ]);

        const footnote = el("div", { class: "hint", text: t.writeHint });

        // ---- read log -------------------------------------------------------
        const logCount = el("span", { class: "count" });
        const logRows = el("div", { class: "log-rows" });
        const logPanel = el("div", { class: "log-panel", style: "display:none" }, [
          el("div", { class: "log-head" }, [
            el("span", { class: "title", text: t.logTitle }),
            logCount,
            el("span", { class: "spacer" }),
            el("button", { text: t.logClear, onclick: () => { state.log = []; renderLog(); } }),
            el("button", { class: "icon ghost", text: "✕", title: t.logClose, onclick: () => toggleLog(false) })
          ]),
          logRows
        ]);

        const content = el("section", { class: "content" }, [
          contentHead, errorBar, gridWrap, logPanel, footnote
        ]);

        root.appendChild(sidebar);
        root.appendChild(createSplitter(root, sidebar, content));
        root.appendChild(content);

        let cellCache = { key: "", cells: [] };
        // Filled by renderDeviceForm so status updates can refresh the form
        // without rebuilding it, which would steal focus from a field.
        let deviceFormRefs = null;

        // ---- form helpers ---------------------------------------------------
        /** A labelled control row, appended to whichever section is given. */
        function formRow(parent, label, control) {
          parent.appendChild(el("div", { class: "form-row" }, [
            el("label", { text: label }),
            control
          ]));
        }

        /** Two labelled controls side by side, for naturally paired settings. */
        function formPair(parent, leftLabel, leftControl, rightLabel, rightControl) {
          parent.appendChild(el("div", { class: "form-pair" }, [
            el("div", { class: "form-row" }, [el("label", { text: leftLabel }), leftControl]),
            el("div", { class: "form-row" }, [el("label", { text: rightLabel }), rightControl])
          ]));
        }

        /**
         * A bounded number field that writes back to `target[key]`. Works for a
         * device or a range, since both are plain objects with numeric fields.
         */
        function numberInput(target, key, min, max, onDone) {
          return el("input", {
            type: "number", min: String(min), max: String(max), value: String(target[key]),
            onchange: (event) => {
              const value = Math.max(min, Math.min(max, Number(event.target.value) || min));
              target[key] = value;
              event.target.value = String(value);
              onDone();
            }
          });
        }

        // ---- persistence ----------------------------------------------------
        function persistDevices() {
          writeStorage(deviceKey, persistable(state.devices, DEVICE_KEYS));
        }

        function persistScopes() {
          writeStorage(scopeKey, {
            activeId: state.activeId,
            scopes: persistable(state.scopes, SCOPE_KEYS)
          });
        }

        // ---- tabs -----------------------------------------------------------
        function setTab(tab) {
          state.tab = tab;
          renderSidebar();
        }

        function addCurrent() {
          if (state.tab === "devices") addDevice();
          else addScope();
        }

        function renderSidebar() {
          const onDevices = state.tab === "devices";
          deviceTab.setAttribute("aria-selected", String(onDevices));
          rangeTab.setAttribute("aria-selected", String(!onDevices));
          deviceList.style.display = onDevices ? "" : "none";
          scopeList.style.display = onDevices ? "none" : "";
          addButton.title = onDevices ? t.addDevice : t.addScope;
          // The header names the active range's device, so it follows every
          // selection, not just connection events.
          renderHeaderDevice();
          if (onDevices) {
            renderDeviceList();
            renderDeviceForm();
          } else {
            renderScopeList();
            renderConfig();
            syncLayoutInputs();
          }
        }

        // ---- device list ----------------------------------------------------
        function renderDeviceList() {
          deviceList.textContent = "";
          if (!state.devices.length) {
            deviceList.appendChild(el("div", { class: "empty-list", text: t.noDevices }));
            return;
          }
          for (const device of state.devices) {
            const selected = device.id === selectedDevice()?.id;
            const item = el("div", {
              class: "scope-item" + (selected ? " active" : ""),
              tabindex: "0", role: "button",
              "aria-current": selected ? "true" : null,
              onclick: () => selectDevice(device),
              onkeydown: (event) => {
                if (event.key === "Enter" || event.key === " ") { event.preventDefault(); selectDevice(device); }
              }
            });
            item.appendChild(el("span", { class: "scope-dot " + statusClass(device) }));
            item.appendChild(el("div", { class: "scope-body" }, [
              el("span", {
                class: "scope-name", text: deviceLabel(device),
                title: `${deviceLabel(device)} · ${deviceEndpoint(device)}`
              }),
              el("span", { class: "scope-meta", text: deviceSummary(device) })
            ]));
            deviceList.appendChild(item);
          }
        }

        function statusClass(device) {
          if (device.status === "open") return "ok";
          if (device.status === "error") return "bad";
          if (device.status === "opening") return "warn";
          return "";
        }

        function statusText(device) {
          switch (device.status) {
            case "open":
              return device.latencyMs === null ? t.deviceOpen : `${t.deviceOpen} · ${device.latencyMs} ${t.ms}`;
            case "opening": return t.deviceOpening;
            case "error": return t.deviceError;
            default: return t.deviceIdle;
          }
        }

        function deviceSummary(device) {
          return `${deviceEndpoint(device)} · ${statusText(device)}`;
        }

        function renderHeaderDevice() {
          const scope = active();
          const device = scope ? deviceOf(scope) : null;
          const conn = document.querySelector("#conn");
          const connId = document.querySelector("#conn-id");
          if (!conn || !connId) return;
          conn.classList.remove("live", "dead");
          if (!device) {
            connId.textContent = t.noDevice;
            connId.title = "";
            return;
          }
          if (device.status === "open") conn.classList.add("live");
          else if (device.status === "error") conn.classList.add("dead");
          connId.textContent = `${deviceLabel(device)} · ${statusText(device)}`;
          connId.title = [
            deviceEndpoint(device),
            `${t.unit} ${device.unitId}`,
            connectionId ? `connection ${connectionId}` : "",
            device.error || ""
          ].filter(Boolean).join(" · ");
        }

        function selectDevice(device) {
          state.selectedDeviceId = device.id;
          renderDeviceList();
          renderDeviceForm();
          renderHeaderDevice();
        }

        function addDevice() {
          const previous = selectedDevice();
          const device = newDevice(previous
            // Same subnet, next host: what you usually want when adding a second
            // PLC to a line, and it is still editable.
            ? { host: previous.host, port: previous.port, unitId: previous.unitId, timeoutMs: previous.timeoutMs }
            : {});
          state.devices.push(device);
          state.selectedDeviceId = device.id;
          persistDevices();
          renderSidebar();
          renderHeaderDevice();
          openDevice(device);
        }

        function removeDevice(device) {
          const used = state.scopes.filter((scope) => scope.deviceId === device.id);
          if (used.length) {
            toast(`${t.deviceInUse}: ${used.length}`, "error");
            return;
          }
          closeDevice(device);
          state.devices = state.devices.filter((entry) => entry !== device);
          if (state.selectedDeviceId === device.id) state.selectedDeviceId = state.devices[0]?.id || null;
          persistDevices();
          renderSidebar();
          renderHeaderDevice();
        }

        // ---- device session -------------------------------------------------
        /**
         * Opens (or re-opens) this device's session and records what happened.
         * Status is runtime state: a device that could not be reached is shown
         * as failed and retried, never silently treated as connected.
         */
        async function openDevice(device, options) {
          if (!device || device.status === "opening") return false;
          const quiet = options && options.quiet;
          clearTimeout(device.retryTimer);
          device.retryTimer = null;
          device.status = "opening";
          device.error = null;
          syncDeviceState();
          try {
            const response = await invoke("modbus/open", {
              deviceId: device.id,
              host: device.host,
              port: Number(device.port) || 502,
              unitId: Number(device.unitId) || 0,
              timeoutMs: Number(device.timeoutMs) || 3000
            }, 30000);
            if (response && response.success) {
              device.status = "open";
              device.latencyMs = typeof response.latencyMs === "number" ? response.latencyMs : null;
              device.retryDelay = 0;
            } else {
              device.status = "error";
              device.latencyMs = null;
              device.error = (response && response.message) || t.deviceError;
            }
          } catch (error) {
            device.status = "error";
            device.latencyMs = null;
            device.error = errorText(error);
          }
          syncDeviceState();
          if (device.status === "error") {
            if (!quiet) toast(`${deviceLabel(device)}: ${device.error}`, "error");
            scheduleReconnect(device);
          }
          return device.status === "open";
        }

        async function closeDevice(device) {
          if (!device) return;
          clearTimeout(device.retryTimer);
          device.retryTimer = null;
          device.retryDelay = 0;
          device.status = "idle";
          device.latencyMs = null;
          device.error = null;
          try {
            await invoke("modbus/close", { deviceId: device.id }, 10000);
          } catch (error) {
            // A close that the backend did not confirm still leaves the device
            // idle here; the next open replaces the session anyway.
          }
          syncDeviceState();
        }

        /** Retries a failed device with a growing, capped delay. */
        function scheduleReconnect(device) {
          if (!device || device.retryTimer) return;
          device.retryDelay = Math.min(30000, (device.retryDelay || 1000) * 2);
          device.retryTimer = setTimeout(async () => {
            device.retryTimer = null;
            if (device.status === "idle") return;
            const scope = active();
            const restored = await openDevice(device, { quiet: true });
            if (restored && scope && deviceOf(scope)?.id === device.id) readActive();
            else if (!restored) scheduleReconnect(device);
          }, device.retryDelay);
        }

        /** Refreshes whatever shows device state, without rebuilding the form. */
        function syncDeviceState() {
          renderDeviceList();
          renderHeaderDevice();
          if (deviceFormRefs) syncDeviceForm();
          // Cheap: the in-place path only refreshes text, and it keeps the
          // "device unreachable" bar honest as status changes.
          renderGrid();
        }

        // ---- device form ----------------------------------------------------
        function renderDeviceForm() {
          const device = selectedDevice();
          configForm.textContent = "";
          deviceFormRefs = null;
          if (!device) {
            configForm.appendChild(el("div", { class: "empty-list", text: t.noDevices }));
            return;
          }

          const identity = el("div", { class: "config-section" });
          formRow(identity, t.deviceName, el("input", {
            type: "text", value: device.name || "", placeholder: device.host || t.deviceName,
            onchange: (event) => {
              device.name = event.target.value.trim();
              persistDevices();
              renderDeviceList();
              renderHeaderDevice();
            }
          }));
          configForm.appendChild(identity);

          const addressSection = el("div", { class: "config-section" }, [
            el("div", { class: "title", text: t.groupDevice })
          ]);
          formRow(addressSection, t.host, el("input", {
            type: "text", value: device.host || "", placeholder: "192.168.1.10",
            onchange: (event) => {
              device.host = event.target.value.trim();
              persistDevices();
              renderDeviceList();
              renderHeaderDevice();
            }
          }));
          formPair(
            addressSection,
            t.port, numberInput(device, "port", 1, 65535, () => {
              persistDevices();
              renderDeviceList();
              renderHeaderDevice();
            }),
            t.unit, numberInput(device, "unitId", 0, 255, () => {
              persistDevices();
              renderHeaderDevice();
            })
          );
          formRow(addressSection, t.deviceTimeout, numberInput(device, "timeoutMs", 200, 120000, () => {
            persistDevices();
          }));
          configForm.appendChild(addressSection);

          // ---- connection ----------------------------------------------------
          const statusSection = el("div", { class: "config-section" }, [
            el("div", { class: "title", text: t.groupConnection })
          ]);
          const statusLine = el("div", { class: "device-status" });
          const errorLine = el("div", { class: "device-error" });
          const connectButton = el("button", {
            class: "primary", text: t.connect,
            onclick: () => { device.retryDelay = 0; openDevice(device); }
          });
          const disconnectButton = el("button", { text: t.disconnect, onclick: () => closeDevice(device) });
          const deleteButton = el("button", {
            class: "ghost danger", text: t.deleteDevice,
            onclick: () => removeDevice(device)
          });
          statusSection.appendChild(statusLine);
          statusSection.appendChild(errorLine);
          statusSection.appendChild(el("div", { class: "button-row" }, [
            connectButton, disconnectButton, deleteButton
          ]));
          configForm.appendChild(statusSection);

          deviceFormRefs = { deviceId: device.id, statusLine, errorLine, connectButton, disconnectButton };
          syncDeviceForm();
        }

        function syncDeviceForm() {
          if (!deviceFormRefs) return;
          const device = deviceById(deviceFormRefs.deviceId);
          if (!device) { deviceFormRefs = null; return; }
          const { statusLine, errorLine, connectButton, disconnectButton } = deviceFormRefs;
          statusLine.textContent = statusText(device);
          statusLine.className = "device-status " + statusClass(device);
          errorLine.textContent = device.error || "";
          errorLine.style.display = device.error ? "" : "none";
          connectButton.disabled = device.status === "opening";
          connectButton.textContent = device.status === "open" ? t.reconnect : t.connect;
          disconnectButton.disabled = device.status !== "open";
        }

        // ---- scope list -----------------------------------------------------
        function renderScopeList() {
          scopeList.textContent = "";
          for (const scope of state.scopes) {
            const selected = scope.id === state.activeId;
            const item = el("div", {
              class: "scope-item" + (selected ? " active" : ""),
              tabindex: "0", role: "button",
              "aria-current": selected ? "true" : null,
              onclick: () => selectScope(scope),
              onkeydown: (event) => {
                if (event.key === "Enter" || event.key === " ") { event.preventDefault(); selectScope(scope); }
              }
            });
            const dotState = scope.result ? (scope.result.error ? "bad" : "ok") : "";
            item.appendChild(el("span", { class: "scope-dot " + dotState }));
            item.appendChild(el("div", { class: "scope-body" }, [
              el("span", { class: "scope-name", text: scopeTitle(scope), title: scopeTitle(scope) }),
              el("span", {
                class: "scope-meta",
                text: `${formatAddress(scope.start)}–${formatAddress(scope.start + Math.max(1, scope.quantity) - 1)} · ${deviceLabel(deviceOf(scope))}`
              })
            ]));
            item.appendChild(el("button", {
              class: "icon ghost danger scope-del", text: "✕", title: t.removeScope,
              onclick: (event) => { event.stopPropagation(); removeScope(scope); }
            }));
            scopeList.appendChild(item);
          }
        }

        function addScope() {
          const current = active();
          const patch = current
            ? {
                deviceId: current.deviceId,
                area: current.area,
                // A new range starts where the last one ended, which is the
                // common case when walking through a device block by block.
                start: Math.min(65535, current.start + Math.max(1, current.quantity)),
                quantity: current.quantity,
                dataType: current.dataType,
                byteOrder: current.byteOrder,
                wordOrder: current.wordOrder,
                format: current.format,
                intervalMs: current.intervalMs,
                columns: current.columns,
                rows: current.rows
              }
            : { deviceId: state.devices[0]?.id || "" };
          const scope = newScope(patch);
          state.scopes.push(scope);
          state.activeId = scope.id;
          persistScopes();
          renderSidebar();
          renderGrid(true);
          readActive();
        }

        function removeScope(scope) {
          if (state.scopes.length <= 1) {
            // Keep one configuration at all times: an empty workbench has no
            // meaningful state and no way back without a plus button hunt.
            toast(t.emptyGrid, "info");
            return;
          }
          if (state.timer) stopPolling();
          state.scopes = state.scopes.filter((entry) => entry !== scope);
          if (state.activeId === scope.id) state.activeId = state.scopes[0].id;
          persistScopes();
          renderSidebar();
          renderGrid(true);
          const next = active();
          if (next && !next.result) readActive();
        }

        function selectScope(scope) {
          if (state.activeId === scope.id) return;
          state.activeId = scope.id;
          persistScopes();
          renderSidebar();
          renderGrid(true);
          // Polling follows the selection, otherwise the timer would keep
          // reading a range that is no longer on screen.
          if (state.timer) {
            restartPolling();
          } else if (!scope.result) {
            readActive();
          }
        }

        // ---- config form: one range ----------------------------------------
        function renderConfig() {
          const scope = active();
          if (!scope) return;
          configForm.textContent = "";

          // ---- identity ------------------------------------------------------
          const identity = el("div", { class: "config-section" });
          formRow(identity, t.nameLabel, el("input", {
            type: "text", value: scope.name || "", placeholder: scopeTitle(scope),
            onchange: (event) => {
              scope.name = event.target.value.trim();
              persistScopes();
              renderScopeList();
            }
          }));
          const deviceSelect = el("select", {
            onchange: (event) => {
              scope.deviceId = event.target.value;
              persistScopes();
              renderScopeList();
              changedDefinition();
            }
          }, state.devices.map((device) => el("option", {
            value: device.id, text: deviceLabel(device),
            selected: device.id === scope.deviceId ? "selected" : null
          })));
          if (!state.devices.length) {
            deviceSelect.disabled = true;
            deviceSelect.appendChild(el("option", { value: "", text: t.noDevice }));
          }
          formRow(identity, t.device, deviceSelect);
          configForm.appendChild(identity);

          // ---- address -------------------------------------------------------
          const addressSection = el("div", { class: "config-section" }, [
            el("div", { class: "title", text: t.groupAddress })
          ]);
          formRow(addressSection, t.area, el("select", {
            onchange: (event) => {
              scope.area = event.target.value;
              const cap = isBitArea(scope.area) ? 2000 : 125;
              if (scope.quantity > cap) scope.quantity = cap;
              changedDefinition();
            }
          }, AREAS.map((value) => el("option", {
            value, text: areaLabel(value), selected: value === scope.area ? "selected" : null
          }))));
          formPair(
            addressSection,
            t.start, numberInput(scope, "start", 0, 65535, changedDefinition),
            t.quantity, numberInput(scope, "quantity", 1,
              isBitArea(scope.area) ? 2000 : 125, changedDefinition)
          );
          configForm.appendChild(addressSection);

          // ---- interpretation ------------------------------------------------
          const formatSection = el("div", { class: "config-section" }, [
            el("div", { class: "title", text: t.groupFormat })
          ]);
          const dataTypeSelect = el("select", {
            onchange: (event) => {
              scope.dataType = event.target.value;
              syncWordOrder();
              changedDisplay();
            }
          }, DATA_TYPES.map((value) => el("option", {
            value, text: value, selected: value === scope.dataType ? "selected" : null
          })));
          const byteOrderSelect = el("select", {
            title: t.displayOnly,
            onchange: (event) => { scope.byteOrder = event.target.value; changedDisplay(); }
          }, BYTE_ORDERS.map((value) => el("option", {
            value, text: value, selected: value === scope.byteOrder ? "selected" : null
          })));
          const wordOrderSelect = el("select", {
            onchange: (event) => { scope.wordOrder = event.target.value; changedDisplay(); }
          }, [["big", t.wordBig], ["little", t.wordLittle]].map(([value, label]) => el("option", {
            value, text: label, selected: value === scope.wordOrder ? "selected" : null
          })));
          const displaySelect = el("select", {
            onchange: (event) => { scope.format = event.target.value; changedDisplay(); }
          }, FORMATS.map((value) => el("option", {
            value, text: value, selected: value === scope.format ? "selected" : null
          })));
          formPair(formatSection, t.dataType, dataTypeSelect, t.byteOrder, byteOrderSelect);
          formPair(formatSection, t.wordOrder, wordOrderSelect, t.format, displaySelect);
          configForm.appendChild(formatSection);

          function syncWordOrder() {
            const relevant = registerCount(scope.dataType) >= 4;
            wordOrderSelect.disabled = !relevant;
            wordOrderSelect.style.opacity = relevant ? "" : ".5";
            wordOrderSelect.title = relevant ? t.displayOnly : t.narrowType;
          }
          syncWordOrder();

          // Columns and rows live in the content header, next to the data they
          // arrange, so the form stays about what is read rather than how it is
          // shown.

          // ---- reading -------------------------------------------------------
          const readSection = el("div", { class: "config-section" }, [
            el("div", { class: "title", text: t.groupRead })
          ]);
          formRow(readSection, `${t.interval} (${t.ms})`, numberInput(scope, "intervalMs", 50, 600000, () => {
            persistScopes();
            if (state.timer) restartPolling();
          }));
          configForm.appendChild(readSection);
        }

        /**
         * Changing which addresses are read invalidates what is on screen.
         * Changing only how they are interpreted does not: the registers that
         * came back are still correct, so the grid is re-rendered rather than
         * emptied, and byte order takes effect without another request.
         */
        function changedDefinition() {
          const scope = active();
          if (scope) {
            scope.result = null;
            scope.page = 0;
          }
          persistScopes();
          renderScopeList();
          renderGrid(true);
          // A new range has nothing to show until it is read, and the user has
          // just asked for it. Polling will pick it up on the next tick.
          if (!state.timer) readActive();
        }

        function changedDisplay() {
          persistScopes();
          renderGrid();
        }

        // ---- reading --------------------------------------------------------
        function scopeTask(scope, device) {
          const task = {
            area: scope.area,
            address: scope.start,
            quantity: scope.quantity,
            // The unit lives on the device, but it is sent per read so editing
            // it takes effect immediately instead of needing a reconnect.
            unitId: Number(device.unitId) || 0,
            dataType: scope.dataType
          };
          if (!isBitArea(scope.area)) {
            task.byteOrder = scope.byteOrder;
            task.wordOrder = scope.wordOrder;
          }
          return task;
        }

        async function readActive() {
          const scope = active();
          if (!scope || state.busy) return;
          const device = deviceOf(scope);
          if (!device) {
            renderHeaderDevice();
            return;
          }
          if (device.status !== "open") {
            // The first read of a device is also the thing that connects it.
            const opened = await openDevice(device, { quiet: true });
            if (!opened) return;
          }
          state.busy = true;
          const started = Date.now();
          try {
            const response = await invoke("modbus/read", {
              connectionId: sessionId(device), tasks: [scopeTask(scope, device)]
            }, 20000);
            const result = (response.results || [])[0] || { ok: false, error: "no result" };
            const durationMs = Date.now() - started;
            state.tx += 1;
            if (result.ok === false) {
              state.err += 1;
              scope.result = { registers: [], values: [], error: result.error || "error", at: new Date() };
              logRead(scope, device, false, result.error || "error", durationMs);
              noteTransportFailure(device, result.error);
              toast(result.error || "Read failed", "error");
            } else {
              logRead(scope, device, true,
                `${(result.registers || result.values || []).length} ${t.items}`, durationMs);
              scope.result = {
                registers: result.registers || [],
                values: result.values || [],
                error: null,
                at: new Date()
              };
            }
            updateCounters();
            renderScopeList();
            renderGrid();
          } catch (error) {
            state.tx += 1;
            state.err += 1;
            scope.result = { registers: [], values: [], error: errorText(error), at: new Date() };
            logRead(scope, device, false, errorText(error), Date.now() - started);
            noteTransportFailure(device, errorText(error));
            updateCounters();
            renderScopeList();
            renderGrid();
            toast(errorText(error), "error");
          } finally {
            state.busy = false;
          }
        }

        /**
         * A read that failed at the transport level means the session is gone,
         * not that the address was wrong, so the device goes to error and the
         * reconnect loop takes over.
         */
        function noteTransportFailure(device, message) {
          if (!device || !isTransportError(message)) return;
          if (device.status === "error") return;
          device.status = "error";
          device.latencyMs = null;
          device.error = String(message || "");
          syncDeviceState();
          scheduleReconnect(device);
        }

        function updateCounters() {
          sTx.set(String(state.tx));
          sErr.set(String(state.err), state.err ? "bad" : null);
        }

        // ---- read log -------------------------------------------------------
        const LOG_LIMIT = 200;

        function toggleLog(force) {
          state.logOpen = force === undefined ? !state.logOpen : Boolean(force);
          logPanel.style.display = state.logOpen ? "" : "none";
          logButton.setAttribute("aria-pressed", String(state.logOpen));
          if (state.logOpen) renderLog();
        }

        /**
         * Records one read result. Repeats of the same outcome collapse into the
         * newest row, so a one-second poll does not bury every other event while
         * the first occurrence of a new failure still gets its own line.
         */
        function logRead(scope, device, ok, message, durationMs) {
          const entry = {
            at: new Date(),
            deviceId: device ? device.id : "",
            device: deviceLabel(device),
            range: `${formatAddress(scope.start)}–${formatAddress(scope.start + Math.max(1, scope.quantity) - 1)}`,
            ok: Boolean(ok),
            message: String(message || ""),
            durationMs: Math.max(0, Number(durationMs) || 0),
            count: 1
          };
          const last = state.log[0];
          if (last && last.ok === entry.ok && last.message === entry.message
              && last.deviceId === entry.deviceId && last.range === entry.range) {
            last.at = entry.at;
            last.durationMs = entry.durationMs;
            last.count += 1;
          } else {
            state.log.unshift(entry);
            if (state.log.length > LOG_LIMIT) state.log.length = LOG_LIMIT;
          }
          renderLog();
        }

        function timeOf(date) {
          const pad = (value) => String(value).padStart(2, "0");
          return `${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
        }

        function renderLog() {
          logCount.textContent = state.log.length ? `${state.log.length} ${t.logCount}` : "";
          logButton.textContent = state.log.length
            ? `${t.logButton} ${state.log.length}`
            : t.logButton;
          // The rows are only worth building while the drawer is open.
          if (!state.logOpen) {
            logRows.textContent = "";
            return;
          }
          logRows.textContent = "";
          if (!state.log.length) {
            logRows.appendChild(el("div", { class: "log-empty", text: t.logEmpty }));
            return;
          }
          for (const entry of state.log) {
            const row = el("div", {
              class: "log-row" + (entry.ok ? "" : " failed"),
              title: entry.message || ""
            });
            row.appendChild(el("span", { class: "t", text: timeOf(entry.at) }));
            row.appendChild(el("span", { class: "dev", text: entry.device }));
            row.appendChild(el("span", { class: "rng", text: entry.range }));
            row.appendChild(el("span", {
              class: "res " + (entry.ok ? "ok" : "bad"),
              text: entry.ok ? t.logOk : t.logFailed
            }));
            row.appendChild(el("span", { class: "msg", text: entry.message }));
            row.appendChild(el("span", {
              class: "d",
              text: entry.count > 1 ? `${entry.durationMs} ms ×${entry.count}` : `${entry.durationMs} ms`
            }));
            logRows.appendChild(row);
          }
        }

        // ---- paging ---------------------------------------------------------
        function turnPage(delta) {
          const scope = active();
          if (!scope) return;
          const pages = pageCount(scope);
          if (pages <= 1) return;
          scope.page = (Math.min(pages - 1, Math.max(0, (scope.page || 0) + delta)));
          renderGrid(true);
        }

        /** Columns and rows are display-only, so they never trigger a read. */
        function setLayout(key, raw, min, max, input) {
          const scope = active();
          if (!scope) return;
          const value = Math.max(min, Math.min(max, Number(raw) || min));
          scope[key] = value;
          if (input) input.value = String(value);
          scope.page = 0;
          persistScopes();
          renderGrid(true);
          syncLayoutInputs();
        }

        function syncLayoutInputs() {
          const scope = active();
          if (!scope) return;
          columnsInput.value = String(scope.columns);
          rowsInput.value = String(scope.rows);
        }

        // ---- the address/value grid -----------------------------------------
        function renderGrid(force) {
          const scope = active();
