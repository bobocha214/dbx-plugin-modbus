          if (!scope) return;
          const bit = isBitArea(scope.area);
          const capacity = pageCapacity(scope);
          const total = Math.max(1, scope.quantity);
          const pages = pageCount(scope);
          scope.page = Math.min(pages - 1, Math.max(0, Number(scope.page) || 0));

          const first = scope.page * capacity;
          const shown = Math.min(capacity, total - first);
          const key = `${scope.area}:${scope.start}:${total}:${bit ? "b" : "r"}:${scope.columns}:${scope.rows}:${scope.page}`;

          const rangeStart = scope.start + first;
          const rangeEnd = rangeStart + shown - 1;
          const countText = pages > 1 ? `${shown} / ${total} ${t.items}` : `${total} ${t.items}`;
          rangeLabel.textContent = `${formatAddress(rangeStart)} – ${formatAddress(rangeEnd)} · ${countText}`;

          pager.style.display = pages > 1 ? "" : "none";
          pageInfo.textContent = pages > 1 ? `${scope.page + 1} / ${pages}` : "";
          prevButton.disabled = scope.page <= 0;
          nextButton.disabled = scope.page >= pages - 1;

          // A device that cannot be reached explains an empty grid better than
          // the last read error does, so it takes precedence.
          const device = deviceOf(scope);
          const deviceDown = device && device.status === "error"
            ? `${deviceLabel(device)} · ${device.error || t.deviceError}`
            : "";
          const error = deviceDown || (scope.result && scope.result.error) || "";
          errorBar.style.display = error ? "" : "none";
          errorBar.textContent = error;
          footnote.textContent = scope.result ? t.writeHint : t.emptyTable;

          renderDecoded(scope);

          if (!force && cellCache.key === key && cellCache.cells.length === shown) {
            updateCells(scope, first);
            return;
          }

          valueGrid.style.setProperty("--cols", String(Math.max(1, scope.columns)));
          valueGrid.textContent = "";
          cellCache = { key, cells: [] };

          for (let offset = 0; offset < shown; offset += 1) {
            const index = first + offset;
            const address = scope.start + index;
            const cell = el("div", { class: "av" });
            cell.appendChild(el("span", { class: "a", text: formatAddress(address) }));

            if (bit) {
              const bitState = el("span", { class: "bit" });
              bitState.appendChild(el("i"));
              bitState.appendChild(el("span", { class: "txt" }));
              const holder = el("span", { class: "cell-value" });
              holder.appendChild(bitState);
              cell.appendChild(holder);
              const rawCell = el("span", { class: "r" });
              cell.appendChild(rawCell);

              if (scope.area === "coil") {
                holder.title = `${formatAddress(address)} · ${t.writeHint}`;
                holder.addEventListener("dblclick", () => writeCell(scope, address));
              } else {
                holder.classList.add("readonly");
                holder.title = `${formatAddress(address)} · ${t.readOnlyArea}`;
              }
              cellCache.cells.push({ cell, holder, bit: bitState, rawCell, address });
            } else {
              const holder = el("span", { class: "cell-value v" });
              cell.appendChild(holder);
              const rawCell = el("span", { class: "r" });
              cell.appendChild(rawCell);

              if (scope.area === "holding") {
                holder.title = `${formatAddress(address)} · ${scope.dataType} · ${t.writeHint}`;
                holder.addEventListener("dblclick", () => writeCell(scope, address));
              } else {
                holder.classList.add("readonly");
                holder.title = `${formatAddress(address)} · ${t.readOnlyArea}`;
              }
              cellCache.cells.push({ cell, holder, rawCell, address });
            }
            valueGrid.appendChild(cell);
          }
          updateCells(scope, first);
        }

        function updateCells(scope, first) {
          const bit = isBitArea(scope.area);
          const result = scope.result;
          for (let offset = 0; offset < cellCache.cells.length; offset += 1) {
            const cell = cellCache.cells[offset];
            const index = first + offset;
            if (bit) {
              const value = result && result.values ? result.values[index] : undefined;
              cell.bit.className = "bit" + (value === undefined ? " unknown" : (value ? " on" : ""));
              cell.bit.lastChild.textContent = value === undefined ? "—" : (value ? t.on : t.off);
              cell.rawCell.textContent = value === undefined ? "" : (value ? "1" : "0");
              cell.holder.classList.toggle("muted", value === undefined);
            } else {
              const value = result && result.registers ? result.registers[index] : undefined;
              cell.holder.textContent = formatRegister(value, scope.format);
              cell.holder.classList.toggle("muted", value === undefined);
              cell.rawCell.textContent = value === undefined
                ? "" : "0x" + (((Number(value) % 65536) + 65536) % 65536).toString(16).toUpperCase().padStart(4, "0");
            }
          }
        }

        function renderDecoded(scope) {
          const bit = isBitArea(scope.area);
          if (!scope.result || scope.result.error || bit) {
            decodedBox.style.display = "none";
            return;
          }
          decodedBox.style.display = "";
          const value = decodeRegistersClient(scope.result.registers, scope.dataType, scope.byteOrder, scope.wordOrder);
          decodedValue.textContent = formatValue(value);
          decodedMeta.textContent = [
            scope.dataType, scope.byteOrder, scope.wordOrder,
            `${registerCount(scope.dataType)} × 16-bit`
          ].join(" · ");
        }

        // ---- writing --------------------------------------------------------
        async function writeCell(scope, address) {
          const device = deviceOf(scope);
          if (!device) return;
          const bit = isBitArea(scope.area);
          const index = address - scope.start;
          const existing = scope.result
            ? (bit ? (scope.result.values || [])[index] : (scope.result.registers || [])[index])
            : undefined;

          const field = el("input", {
            type: "text",
            value: bit ? (existing ? "true" : "false") : formatRegister(existing, "unsigned"),
            placeholder: bit ? "true / false" : scope.dataType
          });
          const payload = [
            `${deviceLabel(device)} · ${t[scope.area] || scope.area} @ ${formatAddress(address)}`,
            `${t.unit} ${device.unitId}`,
            bit ? "" : scope.dataType
          ].filter(Boolean).join(" · ");

          const confirmed = await confirmDialog({
            title: bit ? t.writeTitleCoil : t.writeTitleRegister,
            body: t.confirmWriteBody,
            payload, field, label: t.value,
            confirmLabel: t.confirm
          });
          if (confirmed === null) return;

          try {
            const entry = { area: scope.area, address, unitId: Number(device.unitId) || 0 };
            if (bit) {
              const text = String(field.value).trim().toLowerCase();
              entry.value = !(text === "false" || text === "0");
            } else {
              entry.dataType = scope.dataType;
              entry.byteOrder = scope.byteOrder;
              entry.wordOrder = scope.wordOrder;
              entry.value = Number(field.value);
              if (!Number.isFinite(entry.value)) {
                toast(`"${field.value}" is not a number`, "error");
                return;
              }
            }
            const response = await invoke("modbus/write", {
              connectionId: sessionId(device), writes: [entry]
            }, 20000);
            const result = (response.results || [])[0];
            state.tx += 1;
            if (result && result.ok) {
              toast(`${formatAddress(address)} ← ${field.value}`, "info");
              readActive();
            } else {
              state.err += 1;
              updateCounters();
              noteTransportFailure(device, result && result.error);
              toast((result && result.error) || "Write failed", "error");
            }
          } catch (error) {
            noteTransportFailure(device, errorText(error));
            toast(errorText(error), "error");
          }
        }

        // ---- polling --------------------------------------------------------
        function togglePolling() {
          if (state.timer) { stopPolling(); return; }
          startPolling();
        }

        function startPolling() {
          const scope = active();
          if (!scope) return;
          state.timer = setInterval(readActive, scope.intervalMs);
          pollButton.textContent = t.stop;
          pollButton.setAttribute("aria-pressed", "true");
          readActive();
        }

        function stopPolling() {
          clearInterval(state.timer);
          state.timer = null;
          pollButton.textContent = t.poll;
          pollButton.setAttribute("aria-pressed", "false");
        }

        function restartPolling() {
          stopPolling();
          startPolling();
        }

        // ---- boot -----------------------------------------------------------
        (async () => {
          const savedScopes = await readStorage(scopeKey);
          const savedDevices = await readStorage(deviceKey);

          let devices = Array.isArray(savedDevices)
            ? savedDevices.filter((entry) => entry && entry.host).map((entry) => newDevice(entry))
            : [];
          let scopes = [];

          if (savedScopes && Array.isArray(savedScopes.scopes) && savedScopes.scopes.length) {
            scopes = savedScopes.scopes.map((entry) => newScope(entry));
          } else {
            const legacy = await readStorage(legacyKey);
            if (legacy && typeof legacy === "object" && !Array.isArray(legacy)) {
              scopes = [newScope(legacy)];
            }
          }
          if (!scopes.length) scopes = [newScope()];

          // A workbench on a saved connection starts with that endpoint as its
          // first device, so the IP never has to be typed twice.
          if (!devices.length) {
            let seed = null;
            try {
              seed = await invoke("modbus/connection_info", { connectionId }, 10000);
            } catch (error) {
              seed = null;
            }
            const legacyUnit = scopes.find((scope) => scope.unitId !== undefined)?.unitId;
            if (seed && seed.host) {
              devices = [newDevice({
                name: seed.host,
                host: seed.host,
                port: Number(seed.port) || 502,
                unitId: Number(legacyUnit ?? seed.unitId) || 1,
                timeoutMs: 3000
              })];
            }
          }
          if (!devices.length) {
            // Nothing to seed from: offer an empty device so the form is usable.
            devices = [newDevice({ name: "", host: "", port: 502, unitId: 1 })];
          }

          state.devices = devices;
          state.selectedDeviceId = devices[0].id;

          // Ranges from before devices existed carry their own unit id. They
          // are attached to the first device, which inherits that unit so the
          // read still goes to the right slave.
          const orphanUnit = scopes.find((scope) => scope.unitId !== undefined)?.unitId;
          if (orphanUnit !== undefined && devices.length === 1) {
            devices[0].unitId = Number(orphanUnit);
          }
          for (const scope of scopes) {
            if (!scope.deviceId || !devices.some((device) => device.id === scope.deviceId)) {
              scope.deviceId = devices[0].id;
            }
            if (!Number(scope.columns)) scope.columns = SCOPE_DEFAULTS.columns;
            if (!Number(scope.rows)) scope.rows = SCOPE_DEFAULTS.rows;
            if (!Number.isFinite(Number(scope.page))) scope.page = 0;
            // Retired field: the unit belongs to the device now.
            delete scope.unitId;
          }
          state.scopes = scopes;
          state.activeId = (savedScopes && savedScopes.activeId
            && scopes.some((scope) => scope.id === savedScopes.activeId))
            ? savedScopes.activeId
            : scopes[0].id;

          persistDevices();
          persistScopes();
          updateCounters();
          renderSidebar();
          renderHeaderDevice();

          // Reuse sessions the backend already holds (a UI reload keeps them),
          // then open the rest — the active one first so the grid fills fast.
          let open = new Set();
          try {
            const listing = await invoke("modbus/devices", {}, 10000);
            open = new Set((listing.devices || []).map((entry) => entry.deviceId));
          } catch (error) {
            open = new Set();
          }
          const ordered = [...state.devices].sort((a, b) => {
            const scope = active();
            const wanted = scope ? scope.deviceId : "";
            return (b.id === wanted ? 1 : 0) - (a.id === wanted ? 1 : 0);
          });
          for (const device of ordered) {
            if (!device.host) continue;
            if (open.has(device.id)) {
              device.status = "open";
              syncDeviceState();
            } else {
              const ok = await openDevice(device, { quiet: true });
              if (!ok) continue;
            }
            const scope = active();
            if (scope && device.id === scope.deviceId && !scope.result) {
              await readActive();
            }
          }
          if (!deviceOf(active()) || deviceOf(active()).status !== "open") readActive();
        })();

        window.addEventListener("beforeunload", () => {
          if (state.timer) clearInterval(state.timer);
          for (const device of state.devices) clearTimeout(device.retryTimer);
        });
      }

      // ---------------------------------------------------------------------
      // OPC UA workbench
      // ---------------------------------------------------------------------
      const NAMESPACE_ROOT = "i=84"; // Root folder: Objects / Types / Views

      /** Single letter per node class, colour-coded, standing in for an icon. */
      function classGlyph(nodeClass) {
        const name = String(nodeClass || "");
        if (name.startsWith("Object")) return ["O", "object"];
        if (name.startsWith("Variable")) return ["V", "variable"];
        if (name.startsWith("Method")) return ["M", "method"];
        if (name.startsWith("View")) return ["W", "view"];
        if (name.includes("Type")) return ["T", "type"];
        return ["·", ""];
      }

      function createOpcuaWorkbench(root) {
        const storageKey = storageKeyFor("opcua.nodes");
        const state = {
          nodes: [], subscriptionId: null, intervalMs: 1000, busy: false,
          selected: null, selectedAttributes: null, namespaces: [], highlight: ""
        };
        const childrenCache = new Map();
        const treeRows = new Map();

        // ---- header actions -------------------------------------------------
        const readAllButton = el("button", { text: t.readAll, onclick: () => readAll() });
        const subscribeButton = el("button", { class: "primary", text: t.subscribe, onclick: () => subscribe() });
        const unsubscribeButton = el("button", { text: t.unsubscribe, onclick: () => unsubscribe() });
        document.querySelector("#appbar-extra").append(readAllButton, subscribeButton, unsubscribeButton);

        // ---- sidebar: address space -----------------------------------------
        const tree = el("div", { class: "tree" });
        const namespaceSelect = el("select", {
          style: "width:100%",
          onchange: (event) => { state.highlight = event.target.value; applyHighlight(); }
        });
        const rebrowseButton = el("button", {
          class: "icon ghost", text: "⟳", title: t.refresh,
          onclick: () => { childrenCache.clear(); loadRoot(); }
        });

        const sidebar = el("aside", { class: "sidebar" }, [
          el("div", { class: "sidebar-head" }, [
            el("span", { class: "label", text: t.browse }),
            el("span", { class: "spacer" }),
            rebrowseButton
          ]),
          el("div", { class: "config", style: "flex:none;padding:8px 10px 6px" }, [
            el("div", { class: "form-row" }, [
              el("label", { text: t.namespace }),
              namespaceSelect
            ])
          ]),
          el("div", { style: "flex:1;min-height:0;overflow:auto;border-top:var(--dbx-line)" }, [tree]),
          el("div", { class: "hint", text: t.browseHint })
        ]);

        // ---- content: watched nodes and values ------------------------------
        const watchHead = el("thead");
        const watchBody = el("tbody");
        const watchTable = el("table", {}, [watchHead, watchBody]);
        const watchWrap = el("div", { class: "table-wrap" }, [watchTable]);

        const nodeInput = el("input", {
          type: "text", placeholder: "ns=3;s=Temperature", style: "width:230px",
          title: t.addNodeHint,
          onkeydown: (event) => {
            if (event.key !== "Enter") return;
            const value = nodeInput.value.trim();
            if (!value) return;
            addNode(value, value);
            nodeInput.value = "";
          }
        });

        // The read/subscribe actions live in the header; the content head only
        // holds the node id field, so nothing is offered twice.
        const watchCount = el("span", { class: "count" });
        const contentHead = el("div", { class: "content-head" }, [
          el("div", { class: "content-title" }, [
            el("h2", { text: t.watch }),
            watchCount
          ]),
          el("span", { class: "spacer" }),
          nodeInput
        ]);

        const attrs = el("div", { class: "attrs" });
        const attrsPanel = el("div", { class: "attrs-panel" }, [
          el("div", { class: "attrs-head" }, [
            el("span", { text: t.attributes }),
            el("span", { class: "spacer" }),
            el("span", { id: "attr-node", style: "font-family:var(--dbx-mono);text-transform:none;letter-spacing:0" })
          ]),
          attrs
        ]);

        const content = el("section", { class: "content" }, [
          contentHead, watchWrap, attrsPanel
        ]);

        root.appendChild(sidebar);
        root.appendChild(createSplitter(root, sidebar, content));
        root.appendChild(content);

        function persist() {
          writeStorage(storageKey, persistable(state.nodes, ["nodeId", "label"]));
        }

        // ---- watch list ------------------------------------------------------
        function renderWatch() {
          watchHead.textContent = "";
          watchHead.appendChild(el("tr", {}, [
            el("th", { text: t.nodeId }),
            el("th", { text: t.value }),
            el("th", { text: t.dataType }),
            el("th", { text: t.timestamp }),
            el("th", { text: t.quality }),
            el("th", { text: "" })
          ]));

          watchBody.textContent = "";
          watchCount.textContent = state.nodes.length ? `${state.nodes.length} ${t.items}` : "";

          if (!state.nodes.length) {
            watchBody.appendChild(el("tr", {}, [
              el("td", { colspan: "6" }, [el("div", { class: "empty", text: t.emptyNodes })])
            ]));
            return;
          }

          for (const node of state.nodes) {
            const bad = node.status !== undefined && node.status !== "" && !node.good;
            const tr = el("tr");
            tr.appendChild(el("td", { class: "kv", text: node.nodeId, title: node.nodeId }));
            const valueCell = el("td", { class: "val" });
            valueCell.appendChild(el("span", {
              class: "cell-value", title: t.writeHint,
              onclick: () => writeNode(node),
              text: formatValue(node.value)
            }));
            tr.appendChild(valueCell);
            tr.appendChild(el("td", { class: "note", text: node.dataType || "" }));
            tr.appendChild(el("td", {
              class: "note", text: node.sourceTimestamp ? shortTime(node.sourceTimestamp) : ""
            }));
            tr.appendChild(el("td", {
              class: node.good ? "good" : (bad ? "bad" : "note"),
              text: node.status || (node.good ? "Good" : "")
            }));
            tr.appendChild(el("td", {}, [
              el("button", {
                class: "icon ghost danger", text: "✕", title: t.removeScope,
                onclick: () => {
                  state.nodes = state.nodes.filter((entry) => entry !== node);
                  persist();
                  renderWatch();
                  collectNamespaces();
                }
              })
            ]));
            watchBody.appendChild(tr);
          }
        }

        function shortTime(value) {
          const text = String(value);
          const match = text.match(/T(\d{2}:\d{2}:\d{2})/);
          return match ? match[1] : text;
        }

        function addNode(nodeId, label) {
          if (!nodeId || state.nodes.some((node) => node.nodeId === nodeId)) return;
          state.nodes.push({ nodeId, label: label || "", value: null, dataType: "", status: "", good: false });
          persist();
          renderWatch();
          collectNamespaces();
          readAll();
        }

        // ---- address space ---------------------------------------------------
        async function browseChildren(nodeId) {
          const response = await invoke("opcua/browse", { connectionId, nodeId, direction: "forward", maxReferences: 1000 }, 30000);
          return response.references || [];
        }

        function renderTreeRow(container, reference, depth) {
          const nodeId = reference.nodeId;
          const label = reference.displayName || reference.browseName;
          const row = el("div", {
            class: "tree-row", style: `padding-left:${depth * 13 + 4}px`, title: nodeId
          });
          const twisty = el("span", { class: "twisty", text: "▸" });
          const [glyph, glyphClass] = classGlyph(reference.nodeClass);
          row.appendChild(twisty);
          row.appendChild(el("span", { class: "nclass " + glyphClass, text: glyph }));
          row.appendChild(el("span", { class: "name", text: label }));
          container.appendChild(row);

          const childrenBox = el("div", { style: "display:none" });
          container.appendChild(childrenBox);
          treeRows.set(nodeId, row);

          let loaded = false;
          let open = false;
          const toggle = async () => {
            if (open) {
              open = false;
              childrenBox.style.display = "none";
              twisty.textContent = "▸";
              return;
            }
            if (!loaded) {
              twisty.textContent = "…";
              try {
                const references = childrenCache.has(nodeId) ? childrenCache.get(nodeId) : await browseChildren(nodeId);
                childrenCache.set(nodeId, references);
                childrenBox.textContent = "";
                if (!references.length) {
                  childrenBox.appendChild(el("div", {
                    class: "hint", style: `padding-left:${(depth + 1) * 13 + 22}px`,
                    text: t.noChildren
                  }));
                }
                for (const reference2 of references) renderTreeRow(childrenBox, reference2, depth + 1);
                loaded = true;
                // Newly revealed children can introduce namespaces the picker
                // has not seen yet.
                collectNamespaces();
                applyHighlight();
              } catch (error) {
                twisty.textContent = "▸";
                toast(errorText(error), "error");
                return;
              }
            }
            open = true;
            childrenBox.style.display = "";
            twisty.textContent = "▾";
          };

          row.addEventListener("click", () => { selectNode(nodeId); toggle(); });
          row.addEventListener("dblclick", (event) => { event.stopPropagation(); addNode(nodeId, label); });
        }

        // One namespace is highlighted at a time rather than filtering the rest
        // out, which keeps the tree shape stable while drawing the eye.
        function applyHighlight() {
          for (const [nodeId, row] of treeRows) {
            if (!state.highlight) { row.classList.remove("dim", "highlight"); continue; }
            const namespace = namespaceOf(nodeId);
            row.classList.toggle("highlight", namespace === state.highlight);
            row.classList.toggle("dim", namespace !== state.highlight);
          }
        }

        function namespaceOf(nodeId) {
          const match = String(nodeId).match(/ns=(\d+)/);
          return match ? match[1] : "0";
        }

        function collectNamespaces() {
          const found = new Set();
          for (const nodeId of treeRows.keys()) found.add(namespaceOf(nodeId));
          for (const node of state.nodes) found.add(namespaceOf(node.nodeId));
          state.namespaces = [...found].sort((a, b) => Number(a) - Number(b));
          namespaceSelect.textContent = "";
          namespaceSelect.appendChild(el("option", { value: "", text: t.allNamespaces }));
          for (const index of state.namespaces) {
            namespaceSelect.appendChild(el("option", {
              value: index, text: `ns=${index}`,
              selected: state.highlight === index ? "selected" : null
            }));
          }
        }

        async function loadRoot() {
          tree.textContent = "";
          treeRows.clear();
          tree.appendChild(el("div", { class: "hint", text: t.loading }));
          try {
            const roots = await browseChildren(NAMESPACE_ROOT);
            tree.textContent = "";
            for (const reference of roots) renderTreeRow(tree, reference, 0);
            if (!roots.length) tree.appendChild(el("div", { class: "hint", text: t.noChildren }));
            collectNamespaces();
            applyHighlight();
          } catch (error) {
            tree.textContent = "";
            tree.appendChild(el("div", { class: "hint", text: errorText(error) }));
          }
        }

        // ---- attributes ------------------------------------------------------
        function renderAttributes() {
          attrs.textContent = "";
          const heading = document.getElementById("attr-node");
          if (heading) heading.textContent = state.selected || "";
          if (!state.selected) {
            attrs.appendChild(el("div", { class: "empty", text: t.attrHint }));
            return;
          }
          const rows = [
            [t.nodeId, state.selected],
            ...(state.selectedAttributes || [])
          ];
          for (const [key, value] of rows) {
            attrs.appendChild(el("div", { class: "attr" }, [
              el("span", { class: "k", text: key }),
              el("span", { class: "v", text: value })
            ]));
          }
        }

        // Reading a node reuses the normal read path so the pane shows exactly
        // what the device reports, not a cached copy.
        async function selectNode(nodeId) {
          state.selected = nodeId;
          state.selectedAttributes = null;
          for (const [id, row] of treeRows) row.classList.toggle("selected", id === nodeId);
          renderAttributes();
          try {
            const response = await invoke("opcua/read", { connectionId, nodeIds: [nodeId] }, 30000);
            const first = (response.results || [])[0] || {};
            state.selectedAttributes = [
              [t.value, formatValue(first.value)],
              [t.dataType, first.dataType || ""],
              [t.quality, first.status || ""],
              ["Source ts", first.sourceTimestamp || ""],
              ["Server ts", first.serverTimestamp || ""]
            ];
          } catch (error) {
            state.selectedAttributes = [["Error", errorText(error)]];
          }
          renderAttributes();
        }

        // ---- reading ---------------------------------------------------------
        async function readAll() {
          if (state.busy || !state.nodes.length) return;
          state.busy = true;
          try {
            const response = await invoke("opcua/read", {
              connectionId, nodeIds: state.nodes.map((node) => node.nodeId)
            }, 30000);
            (response.results || []).forEach((result, index) => {
              const node = state.nodes[index];
              if (!node) return;
              node.value = result.value;
              node.dataType = result.dataType;
              node.status = result.status;
              node.good = result.good;
              node.sourceTimestamp = result.sourceTimestamp;
            });
            renderWatch();
            const bad = (response.results || []).filter((result) => result.good === false);
            if (bad.length) toast(`${bad.length}/${state.nodes.length} nodes are not good quality`, "error");
          } catch (error) {
            toast(errorText(error), "error");
          } finally {
            state.busy = false;
          }
        }

        async function subscribe() {
          if (!state.nodes.length) return;
          try {
            if (state.subscriptionId !== null) await unsubscribe();
            const response = await invoke("opcua/subscribe", {
              connectionId, nodeIds: state.nodes.map((node) => node.nodeId), intervalMs: state.intervalMs
            }, 30000);
            state.subscriptionId = response.subscriptionId;
            subscribeButton.setAttribute("aria-pressed", "true");
            toast(`Subscribed ${state.nodes.length} node(s) every ${response.intervalMs} ms`, "info");
          } catch (error) {
            toast(errorText(error), "error");
          }
        }

        async function unsubscribe() {
          if (state.subscriptionId === null) return;
          const subscriptionId = state.subscriptionId;
          state.subscriptionId = null;
          subscribeButton.removeAttribute("aria-pressed");
          try {
            await invoke("opcua/unsubscribe", { connectionId, subscriptionId }, 20000);
          } catch (error) {
            toast(errorText(error), "error");
          }
        }

        async function writeNode(node) {
          const field = el("input", {
            type: "text", value: node.value === null || node.value === undefined ? "" : formatValue(node.value),
            placeholder: node.dataType && node.dataType !== "Null" ? node.dataType : "value"
          });
          const confirmed = await confirmDialog({
            title: t.writeTitleNode,
            body: t.confirmWriteBody,
            payload: node.nodeId,
            field, label: t.value,
            confirmLabel: t.confirm
          });
          if (confirmed === null) return;
          try {
            const response = await invoke("opcua/write", {
              connectionId,
              writes: [{ nodeId: node.nodeId, dataType: node.dataType || "Auto", value: parseScalar(field.value) }]
            }, 30000);
            const result = (response.results || [])[0];
            if (result && result.ok) {
              toast(`${node.nodeId}: ${result.status}`, "info");
              readAll();
            } else {
              toast((result && result.status) || "Write rejected", "error");
            }
          } catch (error) {
            toast(errorText(error), "error");
          }
        }

        // ---- live data changes -----------------------------------------------
        if (host.onEvent) {
          host.onEvent((event) => {
            if (!event || event.method !== "opcua/dataChange") return;
            const payload = event.params || {};
            if (payload.connectionId !== connectionId) return;
            const node = state.nodes.find((entry) => entry.nodeId === payload.nodeId);
            if (!node) return;
            node.value = payload.value;
            node.dataType = payload.dataType;
            node.status = payload.status;
            node.good = Number(payload.statusCode) === 0;
            node.sourceTimestamp = payload.sourceTimestamp;
            renderWatch();
          });
        }

        // ---- boot ------------------------------------------------------------
        (async () => {
          const saved = await readStorage(storageKey);
          if (Array.isArray(saved)) state.nodes = saved.map((node) => ({ ...node, good: false }));
          renderWatch();
          renderAttributes();
          await loadRoot();
          if (state.nodes.length) readAll();
        })();
      }

      // ---------------------------------------------------------------------
      // Bootstrap
      // ---------------------------------------------------------------------
      async function bootstrap() {
        await host.ready;
        locale = host.locale || locale;
        t = locale.toLowerCase().startsWith("zh") ? COPY.zh : COPY.en;

        const context = host.context || {};
        // The routing identity decides which workbench this page instance is.
        const isOpcua = (host.contributionId || "") === OPCUA_WORKBENCH;
        const other = isOpcua ? MODBUS_WORKBENCH : OPCUA_WORKBENCH;
        if ((host.contributionId || "") === other) {
          // Should not happen, but fail loudly rather than render the wrong UI.
          toast(`Unexpected contribution ${host.contributionId}`, "error");
        }

        document.querySelector("#title").textContent = isOpcua ? t.opcua : t.modbus;
        document.title = isOpcua ? t.opcua : t.modbus;

        const conn = document.querySelector("#conn");
        const connId = document.querySelector("#conn-id");
        connectionId = context.connectionId || context.connection_id || null;
        if (!connectionId) {
          conn.classList.add("dead");
          connId.textContent = t.notConnected;
          document.querySelector("#main").appendChild(el("div", { class: "empty", text: t.noConnection }));
          return;
        }
        conn.classList.add("live");
        connId.textContent = connectionId;
        connId.title = connectionId;

        // Both workbenches share one shape: configuration on the left, values
        // on the right.
        const main = document.querySelector("#main");
        if (isOpcua) createOpcuaWorkbench(main);
        else createModbusWorkbench(main);
      }

      window.addEventListener("dbx-plugin-env", (event) => {
        const detail = event.detail || {};
        if (detail.locale && String(detail.locale).toLowerCase().startsWith("zh") !== locale.toLowerCase().startsWith("zh")) {
          locale = detail.locale;
        }
      });

      bootstrap().catch((error) => {
        toast(errorText(error), "error");
      });
    </script>
  </body>
</html>
