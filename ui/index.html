<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DBX Industrial Protocols</title>
    <style>
      /*
       * DBX injects its design tokens on the document root and keeps
       * data-dbx-theme up to date, so everything below follows the host theme.
       * The fallbacks keep the page readable in the standalone dev host.
       */
      :root {
        color-scheme: light dark;
        --industrial-border: color-mix(in srgb, var(--color-foreground, #18181b) 14%, transparent);
        --industrial-subtle: color-mix(in srgb, var(--color-foreground, #18181b) 6%, transparent);
        --industrial-muted: color-mix(in srgb, var(--color-foreground, #18181b) 62%, transparent);
        --industrial-good: #16a34a;
        --industrial-bad: #dc2626;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--color-background, #ffffff);
        color: var(--color-foreground, #18181b);
        font-family: var(--font-sans, Inter, ui-sans-serif, system-ui, sans-serif);
        font-size: 13px;
      }
      #app { display: flex; flex-direction: column; height: 100%; }
      header {
        display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
        padding: 8px 12px;
        border-bottom: 1px solid var(--industrial-border);
        background: color-mix(in srgb, var(--color-background, #fff) 92%, var(--color-foreground, #000) 8%);
      }
      .title { font-weight: 650; margin-right: 4px; }
      .spacer { flex: 1; }
      button, select, input {
        font: inherit;
        color: inherit;
        background: var(--color-background, #fff);
        border: 1px solid var(--industrial-border);
        border-radius: var(--radius-sm, 6px);
        padding: 4px 8px;
      }
      input[type="number"] { width: 76px; }
      button {
        cursor: pointer;
        background: color-mix(in srgb, var(--color-background, #fff) 88%, var(--color-foreground, #000) 12%);
      }
      button:hover:not(:disabled) { border-color: color-mix(in srgb, var(--color-primary, #2563eb) 55%, transparent); }
      button:disabled { opacity: .5; cursor: not-allowed; }
      button.primary {
        background: var(--color-primary, #2563eb);
        color: var(--color-primary-foreground, #fff);
        border-color: transparent;
      }
      button.danger { color: var(--industrial-bad); }
      button.ghost { background: transparent; border-color: transparent; }
      main { flex: 1; min-height: 0; display: flex; }
      .column { flex: 1; min-width: 0; display: flex; flex-direction: column; }
      .column + .column { border-left: 1px solid var(--industrial-border); flex: 0 0 46%; }
      .column-head {
        display: flex; align-items: center; gap: 6px; padding: 6px 10px;
        border-bottom: 1px solid var(--industrial-border);
        font-weight: 600;
      }
      .scroll { flex: 1; overflow: auto; }
      table { border-collapse: collapse; width: 100%; }
      th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--industrial-subtle); vertical-align: middle; }
      th { position: sticky; top: 0; z-index: 1; background: var(--color-background, #fff); font-weight: 600; white-space: nowrap; }
      td.value { font-family: var(--font-mono, ui-monospace, monospace); }
      tr.error td { background: color-mix(in srgb, var(--industrial-bad) 10%, transparent); }
      .badge {
        display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px;
        background: var(--industrial-subtle); color: var(--industrial-muted);
        max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .good { color: var(--industrial-good); }
      .bad { color: var(--industrial-bad); }
      .tree { padding: 6px 4px; }
      .tree-row {
        display: flex; align-items: center; gap: 4px; padding: 2px 4px;
        border-radius: 4px; cursor: pointer; white-space: nowrap;
      }
      .tree-row:hover { background: var(--industrial-subtle); }
      .twisty { width: 14px; display: inline-block; text-align: center; color: var(--industrial-muted); }
      .node-class { color: var(--industrial-muted); font-size: 11px; }
      .hint { padding: 12px; color: var(--industrial-muted); line-height: 1.6; }
      .empty { padding: 24px; text-align: center; color: var(--industrial-muted); }
      .toolbar { display: flex; gap: 6px; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--industrial-subtle); flex-wrap: wrap; }
      dialog {
        border: 1px solid var(--industrial-border);
        border-radius: var(--radius-md, 10px);
        background: var(--color-background, #fff);
        color: inherit;
        max-width: 460px;
        padding: 16px 18px;
      }
      dialog::backdrop { background: rgba(0, 0, 0, .38); }
      dialog h3 { margin: 0 0 8px; font-size: 14px; }
      dialog p { margin: 0 0 12px; line-height: 1.6; color: var(--industrial-muted); }
      dialog .actions { display: flex; justify-content: flex-end; gap: 8px; }
      dialog .payload {
        font-family: var(--font-mono, monospace); background: var(--industrial-subtle);
        padding: 8px; border-radius: 6px; margin-bottom: 12px; overflow: auto;
      }
      #toast { position: fixed; right: 16px; bottom: 16px; max-width: 420px; z-index: 9; display: flex; flex-direction: column; gap: 6px; }
      .toast {
        padding: 8px 12px; border-radius: 8px; border: 1px solid var(--industrial-border);
        background: var(--color-background, #fff); box-shadow: 0 8px 24px rgba(0,0,0,.15);
        white-space: pre-wrap; line-height: 1.5;
      }
      .toast.error { border-color: var(--industrial-bad); }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <span class="title" id="title">Industrial Protocols</span>
        <span class="badge" id="connection-badge">…</span>
      </header>
      <main id="main"></main>
    </div>
    <div id="toast"></div>
    <script>
      "use strict";

      const PLUGIN_ID = "com.dbx.industrial-protocols";
      const MODBUS_WORKBENCH = PLUGIN_ID + ".modbus.workbench";
      const OPCUA_WORKBENCH = PLUGIN_ID + ".opcua.workbench";

      const host = window.dbxPlugin;
      let locale = "en";
      let connectionId = null;

      const COPY = {
        en: {
          modbus: "Modbus TCP", opcua: "OPC UA",
          addRow: "Add row", remove: "Remove", poll: "Start polling", stop: "Stop polling",
          readNow: "Read now", interval: "Interval (ms)",
          name: "Name", area: "Area", address: "Address", quantity: "Qty", dataType: "Type",
          byteOrder: "Byte order", unit: "Unit", value: "Value", registers: "Registers", status: "Status",
          write: "Write", preset: "default", readOnce: "Read", subscribe: "Subscribe",
          unsubscribe: "Unsubscribe", nodeId: "Node id", addNodeHint: "Enter to add a node id",
          browse: "Address space", selected: "Watch list",
          browseHint: "Click a node to expand it. Double-click or right-click a node to add it to the watch list.",
          emptyNodes: "Nothing is being watched yet. Browse the address space or type a node id above.",
          emptyRows: "No rows yet. Add a row to start reading registers.",
          confirmWrite: "Confirm write",
          confirmWriteBody: "This sends a write request to the device. Check the target and the value before continuing.",
          cancel: "Cancel", confirm: "Write now",
          notConnected: "no connection",
          noConnection: "This workbench was opened without a connection. Open it from a saved connection in the sidebar.",
          loading: "Loading…", noChildren: "no children"
        },
        zh: {
          modbus: "Modbus TCP", opcua: "OPC UA",
          addRow: "添加行", remove: "删除", poll: "开始轮询", stop: "停止轮询",
          readNow: "立即读取", interval: "轮询间隔（毫秒）",
          name: "名称", area: "区域", address: "地址", quantity: "数量", dataType: "类型",
          byteOrder: "字节序", unit: "单元号", value: "值", registers: "寄存器", status: "状态",
          write: "写入", preset: "默认", readOnce: "读取", subscribe: "订阅",
          unsubscribe: "取消订阅", nodeId: "节点 ID", addNodeHint: "输入节点 ID 后回车添加",
          browse: "地址空间", selected: "监视列表",
          browseHint: "单击节点展开；双击或右键节点可加入监视列表。",
          emptyNodes: "监视列表为空。请浏览地址空间，或在上方输入节点 ID。",
          emptyRows: "还没有行。添加一行即可开始读取寄存器。",
          confirmWrite: "确认写入",
          confirmWriteBody: "这会对设备发起写操作，请核对目标地址与数值。",
          cancel: "取消", confirm: "确认写入",
          notConnected: "未连接",
          noConnection: "该工作台未绑定连接，请从左侧连接树中的已保存连接打开。",
          loading: "加载中…", noChildren: "无子节点"
        }
      };
      let t = COPY.en;

      // ---------------------------------------------------------------------
      // Helpers
      // ---------------------------------------------------------------------
      function el(tag, props, children) {
        const node = document.createElement(tag);
        for (const [key, value] of Object.entries(props || {})) {
          if (value === null || value === undefined) continue;
          if (key === "class") node.className = value;
          else if (key === "text") node.textContent = value;
          else if (key === "style") node.setAttribute("style", value);
          else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
          else node.setAttribute(key, value);
        }
        for (const child of [].concat(children || [])) {
          if (child) node.appendChild(child);
        }
        return node;
      }

      function toast(message, kind) {
        const node = el("div", { class: "toast" + (kind === "error" ? " error" : ""), text: message });
        document.querySelector("#toast").appendChild(node);
        setTimeout(() => node.remove(), kind === "error" ? 9000 : 3500);
      }

      /** Modal confirm: alert/confirm/prompt are unavailable in the sandbox. */
      function confirmDialog(options) {
        return new Promise((resolve) => {
          const dialog = el("dialog");
          dialog.appendChild(el("h3", { text: options.title }));
          dialog.appendChild(el("p", { text: options.body }));
          if (options.payload) dialog.appendChild(el("div", { class: "payload", text: options.payload }));
          if (options.field) {
            dialog.appendChild(el("div", { style: "display:flex;justify-content:flex-end;margin-bottom:12px" }, [options.field]));
          }
          dialog.appendChild(el("div", { class: "actions" }, [
            el("button", { text: t.cancel, onclick: () => { dialog.close(); resolve(null); } }),
            el("button", { class: "primary", text: options.confirmLabel || t.confirm,
              onclick: () => { dialog.close(); resolve(options.field ? options.field.value : true); } })
          ]));
          dialog.addEventListener("close", () => dialog.remove());
          document.body.appendChild(dialog);
          dialog.showModal();
          if (options.field) options.field.focus();
        });
      }

      function invoke(method, params, timeoutMs) {
        return host.invoke(method, params, { timeoutMs: timeoutMs || 30000 });
      }

      function formatValue(value) {
        if (value === null || value === undefined) return "";
        if (typeof value === "number") {
          if (Number.isInteger(value)) return String(value);
          return String(Number(value.toPrecision(8)));
        }
        if (typeof value === "object") return JSON.stringify(value);
        return String(value);
      }

      function parseScalar(text) {
        const trimmed = String(text).trim();
        if (trimmed === "true") return true;
        if (trimmed === "false") return false;
        if (trimmed !== "" && trimmed !== "-" && !Number.isNaN(Number(trimmed))) return Number(trimmed);
        return trimmed;
      }

      function storageKeyFor(kind) {
        return `${kind}.${connectionId || "default"}`;
      }

      function hasStorage() {
        return !!(host.capabilities && host.capabilities.storage && host.storage);
      }

      // Persisted state keeps only the user's definitions. A live read result is
      // stale the moment it is written, and `storage` caps a single value at
      // 256 KiB, which a 2000-register dump or a long string value would exceed.
      function persistable(items, definitionKeys) {
        return items.map((item) => {
          const kept = {};
          for (const key of definitionKeys) {
            if (item[key] !== undefined) kept[key] = item[key];
          }
          return kept;
        });
      }

      // ---------------------------------------------------------------------
      // Modbus TCP workbench
      // ---------------------------------------------------------------------
      const AREAS = [
        ["holding", "Holding register (FC03)"],
        ["input", "Input register (FC04)"],
        ["coil", "Coil (FC01)"],
        ["discrete", "Discrete input (FC02)"]
      ];
      const DATA_TYPES = ["uint16", "int16", "uint32", "int32", "float32", "uint64", "int64", "float64"];
      const BYTE_ORDERS = ["default", "ABCD", "BADC", "CDAB", "DCBA"];

      function createModbusWorkbench(root) {
        const storageKey = storageKeyFor("modbus.rows");
        const state = { rows: [], timer: null, intervalMs: 1000, busy: false };

        const tbody = el("tbody");
        const table = el("table", {}, [
          el("thead", {}, [el("tr", {}, [
            el("th", { text: t.name }), el("th", { text: t.area }), el("th", { text: t.address }),
            el("th", { text: t.quantity }), el("th", { text: t.dataType }), el("th", { text: t.byteOrder }),
            el("th", { text: t.unit }), el("th", { text: t.value }), el("th", { text: t.registers }),
            el("th", { text: t.status }), el("th", { text: "" })
          ])])
        , tbody]);

        const intervalInput = el("input", {
          type: "number", min: "100", step: "100", value: String(state.intervalMs), style: "width:96px",
          onchange: (event) => {
            state.intervalMs = Math.max(100, Number(event.target.value) || 1000);
            event.target.value = String(state.intervalMs);
            if (state.timer) restartPolling();
          }
        });

        const pollButton = el("button", { text: t.poll, onclick: () => togglePolling() });

        const column = el("div", { class: "column" });
        column.appendChild(el("div", { class: "toolbar" }, [
          el("button", { text: t.addRow, onclick: () => { state.rows.push(blankRow()); persist(); render(); } }),
          el("button", { text: t.readNow, onclick: () => readAll() }),
          pollButton,
          el("span", { class: "spacer" }),
          el("span", { text: t.interval }), intervalInput
        ]));
        column.appendChild(el("div", { class: "scroll" }, [table]));
        root.appendChild(column);

        function blankRow() {
          return {
            id: Math.random().toString(36).slice(2, 10),
            name: "", area: "holding", address: 0, quantity: "",
            dataType: "uint16", byteOrder: "default", unitId: "",
            value: null, registers: null, error: null
          };
        }

        function persist() {
          if (!hasStorage()) return;
          const rows = persistable(state.rows, ["id", "name", "area", "address", "quantity", "dataType", "byteOrder", "unitId"]);
          host.storage.set(storageKey, rows).catch(() => {});
        }

        function render() {
          tbody.textContent = "";
          if (!state.rows.length) {
            tbody.appendChild(el("tr", {}, [el("td", { colspan: "11" }, [el("div", { class: "empty", text: t.emptyRows })])]));
            return;
          }
          state.rows.forEach((row) => tbody.appendChild(renderRow(row)));
        }

        function renderRow(row) {
          const tr = el("tr", { class: row.error ? "error" : "" });
          const bind = (key, node, transform) => node.addEventListener("change", () => {
            row[key] = transform ? transform(node.value) : node.value;
            persist();
          });
          const textInput = (key, width) => {
            const input = el("input", { type: "text", value: row[key], style: width ? `width:${width}` : null });
            bind(key, input, (value) => value.trim());
            return input;
          };
          const numberInput = (key, min, max, width) => {
            const input = el("input", {
              type: "number", min: String(min), max: String(max), style: width ? `width:${width}` : null,
              value: row[key] === "" || row[key] === null ? "" : String(row[key])
            });
            bind(key, input, (value) => (value === "" ? "" : Math.max(min, Math.min(max, Number(value) || min))));
            return input;
          };
          const selectInput = (key, values, labelFor) => {
            const select = el("select", {}, values.map((value) => el("option", {
              value, text: labelFor ? labelFor(value) : value,
              selected: row[key] === value ? "selected" : null
            })));
            bind(key, select);
            return select;
          };

          tr.appendChild(el("td", {}, [textInput("name", "110px")]));
          tr.appendChild(el("td", {}, [selectInput("area", AREAS.map((entry) => entry[0]), (value) => AREAS.find((entry) => entry[0] === value)[1])]));
          tr.appendChild(el("td", {}, [numberInput("address", 0, 65535)]));
          tr.appendChild(el("td", {}, [numberInput("quantity", 1, 2000)]));
          tr.appendChild(el("td", {}, [selectInput("dataType", DATA_TYPES)]));
          tr.appendChild(el("td", {}, [selectInput("byteOrder", BYTE_ORDERS, (value) => (value === "default" ? t.preset : value))]));
          tr.appendChild(el("td", {}, [numberInput("unitId", 0, 255)]));
          tr.appendChild(el("td", { class: "value", text: formatValue(row.value) }));
          tr.appendChild(el("td", { class: "value", text: row.registers ? row.registers.join(" ") : "" }));
          tr.appendChild(el("td", { class: row.error ? "bad" : "", text: row.error || "" }));
          tr.appendChild(el("td", {}, [
            el("button", { class: "primary", text: t.write, onclick: () => writeRow(row) }),
            el("button", { class: "ghost danger", text: "×", title: t.remove, onclick: () => {
              state.rows = state.rows.filter((entry) => entry !== row);
              persist();
              render();
            } })
          ]));
          return tr;
        }

        function toTasks() {
          return state.rows.map((row) => {
            const task = { area: row.area, address: Number(row.address) || 0 };
            if (row.quantity !== "" && row.quantity !== null) task.quantity = Number(row.quantity);
            if (row.dataType) task.dataType = row.dataType;
            if (row.byteOrder && row.byteOrder !== "default") task.byteOrder = row.byteOrder;
            if (row.unitId !== "" && row.unitId !== null) task.unitId = Number(row.unitId);
            return task;
          });
        }

        async function readAll() {
          if (state.busy || !state.rows.length) return;
          state.busy = true;
          try {
            const response = await invoke("modbus/read", { connectionId, tasks: toTasks() }, 20000);
            (response.results || []).forEach((result, index) => {
              const row = state.rows[index];
              if (!row) return;
              if (result.ok) {
                row.error = null;
                row.value = result.value !== undefined ? result.value : result.values;
                row.registers = result.registers || (Array.isArray(result.values) ? result.values : null);
              } else {
                row.error = result.error;
                row.value = null;
                row.registers = null;
              }
            });
            render();
            const failures = (response.results || []).filter((result) => result.ok === false);
            if (failures.length) toast(`${failures.length}/${response.results.length} failed: ${failures[0].error}`, "error");
          } catch (error) {
            toast(String(error && error.message ? error.message : error), "error");
          } finally {
            state.busy = false;
          }
        }

        async function writeRow(row) {
          const isCoil = row.area === "coil";
          const field = el("input", {
            type: isCoil ? "text" : "number",
            placeholder: isCoil ? "true / false" : "value",
            value: isCoil ? "true" : "",
            style: "min-width:160px"
          });
          const confirmed = await confirmDialog({
            title: t.confirmWrite,
            body: t.confirmWriteBody,
            payload: `${row.area} @ ${row.address}${row.unitId === "" ? "" : ` · unit ${row.unitId}`}${isCoil ? "" : ` · ${row.dataType}`}`,
            field, confirmLabel: t.confirm
          });
          if (confirmed === null) return;

          try {
            const entry = { area: row.area, address: Number(row.address) || 0 };
            if (row.unitId !== "" && row.unitId !== null) entry.unitId = Number(row.unitId);
            if (isCoil) {
              entry.value = String(field.value).trim().toLowerCase() !== "false";
            } else {
              entry.dataType = row.dataType;
              if (row.byteOrder !== "default") entry.byteOrder = row.byteOrder;
              entry.value = Number(field.value);
              if (Number.isNaN(entry.value)) {
                toast(`"${field.value}" is not a number`, "error");
                return;
              }
            }
            const response = await invoke("modbus/write", { connectionId, writes: [entry] }, 20000);
            const result = (response.results || [])[0];
            if (result && result.ok) {
              toast(`Wrote ${row.area} @ ${row.address}`);
              readAll();
            } else {
              toast((result && result.error) || "Write failed", "error");
            }
          } catch (error) {
            toast(String(error && error.message ? error.message : error), "error");
          }
        }

        function togglePolling() {
          if (state.timer) {
            clearInterval(state.timer);
            state.timer = null;
            pollButton.textContent = t.poll;
            return;
          }
          state.timer = setInterval(readAll, state.intervalMs);
          pollButton.textContent = t.stop;
          readAll();
        }

        function restartPolling() {
          clearInterval(state.timer);
          state.timer = setInterval(readAll, state.intervalMs);
        }

        (async () => {
          if (hasStorage()) {
            try {
              const saved = await host.storage.get(storageKey);
              if (Array.isArray(saved) && saved.length) {
                state.rows = saved.map((row) => ({ ...blankRow(), ...row, value: null, registers: null, error: null }));
              }
            } catch { /* ignore unreadable state */ }
          }
          if (!state.rows.length) state.rows.push(blankRow());
          render();
          readAll();
        })();

        window.addEventListener("beforeunload", () => { if (state.timer) clearInterval(state.timer); });
      }

      // ---------------------------------------------------------------------
      // OPC UA workbench
      // ---------------------------------------------------------------------
      function createOpcuaWorkbench(root) {
        const storageKey = storageKeyFor("opcua.nodes");
        const state = { nodes: [], subscriptionId: null, intervalMs: 1000, busy: false };
        const childrenCache = new Map();

        const tree = el("div", { class: "tree" });
        const tbody = el("tbody");
        const table = el("table", {}, [
          el("thead", {}, [el("tr", {}, [
            el("th", { text: t.nodeId }), el("th", { text: t.value }), el("th", { text: t.dataType }),
            el("th", { text: t.status }), el("th", { text: "" })
          ])])
        , tbody]);

        const nodeInput = el("input", {
          type: "text", placeholder: "ns=3;s=Temperature", style: "min-width:220px",
          title: t.addNodeHint,
          onkeydown: (event) => {
            if (event.key !== "Enter") return;
            const value = nodeInput.value.trim();
            if (!value) return;
            addNode(value, value);
            nodeInput.value = "";
          }
        });

        root.appendChild(el("div", { class: "column" }, [
          el("div", { class: "column-head" }, [el("span", { text: t.browse })]),
          el("div", { class: "scroll" }, [tree]),
          el("div", { class: "hint", text: t.browseHint })
        ]));
        root.appendChild(el("div", { class: "column" }, [
          el("div", { class: "column-head" }, [el("span", { text: t.selected })]),
          el("div", { class: "toolbar" }, [
            nodeInput,
            el("button", { text: t.readOnce, onclick: () => readAll() }),
            el("button", { class: "primary", text: t.subscribe, onclick: () => subscribe() }),
            el("button", { text: t.unsubscribe, onclick: () => unsubscribe() })
          ]),
          el("div", { class: "scroll" }, [table])
        ]));

        function persist() {
          if (!hasStorage()) return;
          const nodes = persistable(state.nodes, ["nodeId", "label"]);
          host.storage.set(storageKey, nodes).catch(() => {});
        }

        function renderNodes() {
          tbody.textContent = "";
          if (!state.nodes.length) {
            tbody.appendChild(el("tr", {}, [el("td", { colspan: "5" }, [el("div", { class: "empty", text: t.emptyNodes })])]));
            return;
          }
          for (const node of state.nodes) {
            const tr = el("tr", { class: node.status && !node.good ? "error" : "" });
            tr.appendChild(el("td", { class: "value", text: node.nodeId }));
            tr.appendChild(el("td", { class: "value", text: formatValue(node.value) }));
            tr.appendChild(el("td", { text: node.dataType || "" }));
            tr.appendChild(el("td", { class: node.good ? "good" : (node.status ? "bad" : ""), text: node.status || "" }));
            tr.appendChild(el("td", {}, [
              el("button", { class: "ghost", text: t.write, onclick: () => writeNode(node) }),
              el("button", { class: "ghost danger", text: "×", title: t.remove, onclick: () => {
                state.nodes = state.nodes.filter((entry) => entry !== node);
                persist();
                renderNodes();
              } })
            ]));
            tbody.appendChild(tr);
          }
        }

        function addNode(nodeId, label) {
          if (!nodeId || state.nodes.some((node) => node.nodeId === nodeId)) return;
          state.nodes.push({ nodeId, label: label || "", value: null, dataType: "", status: "", good: false });
          persist();
          renderNodes();
          readAll();
        }

        async function browseChildren(nodeId) {
          const response = await invoke("opcua/browse", { connectionId, nodeId, direction: "forward", maxReferences: 1000 }, 30000);
          return response.references || [];
        }

        function renderTreeRow(container, nodeId, label, nodeClass, depth) {
          const row = el("div", { class: "tree-row", style: `padding-left:${depth * 12 + 4}px`, title: nodeId });
          const twisty = el("span", { class: "twisty", text: "▸" });
          row.appendChild(twisty);
          row.appendChild(el("span", { text: label }));
          if (nodeClass) row.appendChild(el("span", { class: "node-class", text: ` ${nodeClass}` }));
          container.appendChild(row);

          const childrenBox = el("div");
          container.appendChild(childrenBox);

          row.addEventListener("click", async () => {
            if (childrenCache.has(nodeId)) {
              const open = childrenBox.style.display !== "none";
              childrenBox.style.display = open ? "none" : "";
              twisty.textContent = open ? "▸" : "▾";
              return;
            }
            twisty.textContent = "…";
            try {
              const references = await browseChildren(nodeId);
              childrenCache.set(nodeId, references);
              childrenBox.textContent = "";
              if (!references.length) {
                childrenBox.appendChild(el("div", {
                  class: "node-class", style: `padding-left:${(depth + 1) * 12 + 18}px`, text: t.noChildren
                }));
              }
              for (const reference of references) {
                renderTreeRow(childrenBox, reference.nodeId, reference.displayName || reference.browseName, reference.nodeClass, depth + 1);
              }
              twisty.textContent = "▾";
            } catch (error) {
              twisty.textContent = "▸";
              toast(String(error && error.message ? error.message : error), "error");
            }
          });

          row.addEventListener("dblclick", (event) => {
            event.stopPropagation();
            addNode(nodeId, label);
          });
          row.addEventListener("contextmenu", (event) => {
            event.preventDefault();
            addNode(nodeId, label);
          });
        }

        async function loadRoot() {
          tree.textContent = "";
          tree.appendChild(el("div", { class: "hint", text: t.loading }));
          try {
            // i=84 is the Root folder; its children are Objects, Types and Views.
            const roots = await browseChildren("i=84");
            tree.textContent = "";
            for (const reference of roots) {
              renderTreeRow(tree, reference.nodeId, reference.displayName || reference.browseName, reference.nodeClass, 0);
            }
            if (!roots.length) tree.appendChild(el("div", { class: "hint", text: t.noChildren }));
          } catch (error) {
            tree.textContent = "";
            tree.appendChild(el("div", { class: "hint", text: String(error && error.message ? error.message : error) }));
          }
        }

        async function readAll() {
          if (state.busy || !state.nodes.length) return;
          state.busy = true;
          try {
            const response = await invoke("opcua/read", {
              connectionId, nodeIds: state.nodes.map((node) => node.nodeId)
            }, 30000);
            (response.results || []).forEach((result, index) => {
              const node = state.nodes[index];
              if (!node) return;
              node.value = result.value;
              node.dataType = result.dataType;
              node.status = result.status;
              node.good = result.good;
            });
            renderNodes();
            const bad = (response.results || []).filter((result) => result.good === false);
            if (bad.length) toast(`${bad.length}/${state.nodes.length} nodes are not good quality`, "error");
          } catch (error) {
            toast(String(error && error.message ? error.message : error), "error");
          } finally {
            state.busy = false;
          }
        }

        async function subscribe() {
          if (!state.nodes.length) return;
          try {
            if (state.subscriptionId !== null) await unsubscribe();
            const response = await invoke("opcua/subscribe", {
              connectionId, nodeIds: state.nodes.map((node) => node.nodeId), intervalMs: state.intervalMs
            }, 30000);
            state.subscriptionId = response.subscriptionId;
            toast(`Subscribed ${state.nodes.length} node(s) every ${response.intervalMs} ms`);
          } catch (error) {
            toast(String(error && error.message ? error.message : error), "error");
          }
        }

        async function unsubscribe() {
          if (state.subscriptionId === null) return;
          const subscriptionId = state.subscriptionId;
          state.subscriptionId = null;
          try {
            await invoke("opcua/unsubscribe", { connectionId, subscriptionId }, 20000);
          } catch (error) {
            toast(String(error && error.message ? error.message : error), "error");
          }
        }

        async function writeNode(node) {
          const field = el("input", {
            type: "text", value: formatValue(node.value),
            placeholder: node.dataType && node.dataType !== "Null" ? node.dataType : "value",
            style: "min-width:180px"
          });
          const confirmed = await confirmDialog({
            title: t.confirmWrite,
            body: t.confirmWriteBody,
            payload: node.nodeId,
            field, confirmLabel: t.confirm
          });
          if (confirmed === null) return;

          try {
            const response = await invoke("opcua/write", {
              connectionId,
              writes: [{ nodeId: node.nodeId, dataType: node.dataType || "Auto", value: parseScalar(field.value) }]
            }, 30000);
            const result = (response.results || [])[0];
            if (result && result.ok) {
              toast(`${node.nodeId}: ${result.status}`);
              readAll();
            } else {
              toast((result && result.status) || "Write rejected", "error");
            }
          } catch (error) {
            toast(String(error && error.message ? error.message : error), "error");
          }
        }

        // Live data changes pushed by the sidecar subscription.
        if (host.onEvent) {
          host.onEvent((event) => {
            if (!event || event.method !== "opcua/dataChange") return;
            const payload = event.params || {};
            if (payload.connectionId !== connectionId) return;
            const node = state.nodes.find((entry) => entry.nodeId === payload.nodeId);
            if (!node) return;
            node.value = payload.value;
            node.dataType = payload.dataType;
            node.status = payload.status;
            node.good = Number(payload.statusCode) === 0;
            renderNodes();
          });
        }

        (async () => {
          if (hasStorage()) {
            try {
              const saved = await host.storage.get(storageKey);
              if (Array.isArray(saved)) state.nodes = saved.map((node) => ({ ...node, good: false }));
            } catch { /* ignore unreadable state */ }
          }
          renderNodes();
          await loadRoot();
          if (state.nodes.length) readAll();
        })();
      }

      // ---------------------------------------------------------------------
      // Bootstrap
      // ---------------------------------------------------------------------
      async function bootstrap() {
        await host.ready;
        locale = host.locale || locale;
        t = locale.toLowerCase().startsWith("zh") ? COPY.zh : COPY.en;

        const context = host.context || {};
        // The routing identity decides which workbench this page instance is.
        const isOpcua = (host.contributionId || "") === OPCUA_WORKBENCH;
        const other = isOpcua ? MODBUS_WORKBENCH : OPCUA_WORKBENCH;
        if ((host.contributionId || "") === other) {
          // Should not happen, but fail loudly rather than render the wrong UI.
          toast(`Unexpected contribution ${host.contributionId}`, "error");
        }

        document.querySelector("#title").textContent = isOpcua ? t.opcua : t.modbus;
        document.title = isOpcua ? t.opcua : t.modbus;

        const badge = document.querySelector("#connection-badge");
        connectionId = context.connectionId || context.connection_id || null;
        if (!connectionId) {
          badge.textContent = t.notConnected;
          document.querySelector("#main").appendChild(el("div", { class: "empty", text: t.noConnection }));
          return;
        }
        badge.textContent = connectionId;
        badge.title = connectionId;

        // Both creators append their own flex columns to #main: one column for
        // Modbus, a browser + watch list pair for OPC UA.
        const main = document.querySelector("#main");
        if (isOpcua) createOpcuaWorkbench(main);
        else createModbusWorkbench(main);
      }

      window.addEventListener("dbx-plugin-env", (event) => {
        const detail = event.detail || {};
        if (detail.locale && String(detail.locale).toLowerCase().startsWith("zh") !== locale.toLowerCase().startsWith("zh")) {
          locale = detail.locale;
        }
      });

      bootstrap().catch((error) => {
        toast(String(error && error.message ? error.message : error), "error");
      });
    </script>
  </body>
</html>
